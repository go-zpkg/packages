name: sovereign build

# Proof that a recipe can be compiled with NO distribution involved: the rootfs
# `zpkb builder` stages from builder/toolchain.txt, entered with chroot, zpkb run
# through pkgx exactly as builder/Containerfile's ENTRYPOINT does.
#
# Why this exists: with the ordinary path, what can be built is decided by the
# runner's distribution. Measured, twice, on our own pool:
#
#   * on debian 12 every compile died at `env: … version GLIBC_2.38 not found`,
#     because zpkb installs a MIRRORED coreutils linked against a newer glibc;
#   * on debian 13 the first recipe through, jonas.github.io/tig, failed on a
#     C23 diagnostic from the runner's GCC — not from the llvm.org artifact we
#     ship and intend to compile with.
#
# Both are the same defect wearing different clothes. go-zpkg owns its build and
# run environment and manages its own libc versions; this is what that looks
# like as a job.

on:
  workflow_dispatch:
    inputs:
      recipes:
        description: "space-separated projects to build inside the sovereign rootfs"
        required: false
        default: "lz4.org"
      versions:
        description: "pkgx constraint; a BARE version is a RANGE, use '=1.2.3' for exactly one"
        required: false
        default: "=1.10.0"
      force:
        description: "rebuild even when the artifact is already published (blank = skip). The point of this job is to COMPILE, and a skipped build proves nothing."
        required: false
        default: "1"
      arch:
        description: "`x86-64` (default) or `aarch64`"
        required: false
        default: "x86-64"
      oci_to:
        description: "registry to PUBLISH to, `oci://host/repo`. REQUIRED: publishing requires an explicit destination; blank is refused, there is no default, and go-pkgx is refused as one. A destination naming go-zpkg is signed ONLY with secrets.ZPKG_SIGNING_KEY and the job fails when that secret is empty; the old key never signs there (go-zpkg/packages#440)."
        required: true
      dist_from:
        description: "registry the toolchain and dependencies are READ from, `oci://host/repo`. Blank = oci://ghcr.io/go-zpkg/packages; go-pkgx is refused. Generation 1 of a two-stage bootstrap sets it to generation 0's throwaway registry."
        required: false
        default: ""
      overlay_ref:
        description: "go-zpkg/recipes branch, tag or SHA the overlay is read from. Blank = main, a moving ref; pass a SHA to make a run reproducible."
        required: false
        default: "main"
      pantry_ref:
        description: "pkgxdev/pantry commit the recipes are read from. Its recipe scripts run during the build, so the default is a recorded SHA and a newer pantry is a deliberate bump, not whatever HEAD is at the minute of the run. A branch, tag or SHA, validated like overlay_ref (go-zpkg/packages#440)."
        required: false
        default: "1879069619956097ab80525b9c27ad15f1f07229"
      extra_trusted_keys:
        description: "extra public keys this run TRUSTS when it installs or verifies, exported as ZPKG_EXTRA_TRUSTED_KEYS to the steps that install or verify: whitespace-separated `name:RW<base64>` entries (go-zpkg/artifact trust.go ParseSigners), at most 8. Blank, as it should normally be. Refused with an oci_to naming go-zpkg: a promotion into go-zpkg must not widen trust (go-zpkg/packages#440)."
        required: false
        default: ""

# Nothing at the workflow level: every job states what it needs. The job that
# runs recipe code on the long-lived self-hosted pool gets `contents: read` and
# no secret; only the publish job, on an ephemeral GitHub-hosted runner, gets
# `packages: write` (secaudit finding 14).
permissions: {}

env:
  # Deps from the module proxy, OUR modules straight from GitHub. `GOPROXY=direct`
  # alone made the bootstrap depend on every vanity-import host in the closure,
  # and gopkg.in's hours of 502s on 2026-10-12 failed the darwin lane twice
  # having built nothing. Measured, and kept uniform across the workflows, by
  # ./goproxycheck.
  GOPROXY: https://proxy.golang.org,direct
  GONOPROXY: github.com/go-zpkg/*

jobs:
  sovereign:
    runs-on: ${{ github.event.inputs.arch == 'aarch64' && fromJSON('["self-hosted","incus","arm64"]') || fromJSON('["self-hosted","incus","amd64"]') }}
    timeout-minutes: 330
    # ⛔ NO SECRET IN THIS JOB, at any level: it runs recipe code on a pool whose
    # runners keep their home directory between jobs. It stages, uploads the
    # staged tree and declares its digest; the `publish` job below signs and
    # pushes. selfhostedsecrets_test.go fails on a `secrets.` reference here.
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      lane: ${{ steps.digest.outputs.lane }}
    env:
      PLATFORM: linux/${{ github.event.inputs.arch || 'x86-64' }}
    steps:
      # The host's only jobs are: run three static Go binaries, and hold a mount
      # namespace. Nothing it links against reaches the build.
      - name: host tools
        run: |
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          command -v git >/dev/null || { $SUDO apt-get update -qq; $SUDO apt-get install -y --no-install-recommends git ca-certificates; }

      # Inputs reach the shell as ENVIRONMENT, never interpolated into the
      # script: a value like `main; curl …` must stay a value. They are
      # validated here, once, and every later step reads the validated
      # spelling from $GITHUB_ENV.
      #
      # ⛔ ONLY oci://ghcr.io/go-zpkg/packages IS SIGNED WITH THE go-zpkg KEY.
      # This step writes SIGN_PROD, the one thing the SIGNING_KEY expression
      # below reads, so the two cannot disagree. A destination that merely
      # contains the name is refused, never signed with either key.
      - name: validate oci_to, dist_from and overlay_ref
        env:
          IN_OCI_TO: ${{ github.event.inputs.oci_to }}
          IN_DIST_FROM: ${{ github.event.inputs.dist_from }}
          IN_OVERLAY_REF: ${{ github.event.inputs.overlay_ref }}
          IN_EXTRA_KEYS: ${{ github.event.inputs.extra_trusted_keys }}
        run: |
          set -eu
          # ⛔ extra_trusted_keys: `name:RW<base64>` entries separated by
          # whitespace (go-zpkg/artifact trust.go ParseSigners), checked
          # strictly here because the value is written to $GITHUB_ENV. `inputcheck`
          # holds the same rules for build.yml; this file validates in shell
          # because its defaults differ (a blank oci_to means the default
          # registry here, not dist_from).
          if [ -n "$IN_EXTRA_KEYS" ]; then
            case "$IN_EXTRA_KEYS" in
              *[!A-Za-z0-9._:+/\ -]*) echo "::error::extra_trusted_keys holds a character outside A-Za-z0-9._:+/ - and the space separator"; exit 1 ;;
            esac
            case "${IN_OCI_TO,,}" in
              *go-zpkg*) echo "::error::extra_trusted_keys cannot be combined with an oci_to naming go-zpkg: a promotion into go-zpkg must not widen trust, it re-signs with ZPKG_SIGNING_KEY (go-zpkg/packages#440)."; exit 1 ;;
            esac
            n=0
            set -f
            for e in $IN_EXTRA_KEYS; do
              n=$((n+1))
              case "$e" in
                *:*) ;;
                *) echo "::error::extra_trusted_keys entry '$e' is not name:key"; exit 1 ;;
              esac
              name=${e%%:*}
              key=${e#*:}
              case "$name" in
                ""|*[!A-Za-z0-9._-]*) echo "::error::extra_trusted_keys name '$name' is empty or outside A-Za-z0-9._-"; exit 1 ;;
              esac
              [ "${#name}" -le 64 ] || { echo "::error::extra_trusted_keys name '$name' is longer than 64 characters"; exit 1; }
              case "$key" in
                RW*) ;;
                *) echo "::error::extra_trusted_keys key for '$name' does not start with RW"; exit 1 ;;
              esac
              case "$key" in
                *[!A-Za-z0-9+/]*) echo "::error::extra_trusted_keys key for '$name' is not base64"; exit 1 ;;
              esac
              [ "${#key}" -eq 56 ] || { echo "::error::extra_trusted_keys key for '$name' is ${#key} characters, a minisign public key is 56"; exit 1; }
            done
            set +f
            [ "$n" -le 8 ] || { echo "::error::extra_trusted_keys names $n keys, more than 8"; exit 1; }
          fi
          # No default for the destination: blank is refused, and go-pkgx is
          # refused as one. dist_from keeps its READ default.
          oci_to=${IN_OCI_TO:-}
          if [ -z "$oci_to" ]; then
            echo "::error::publishing requires an explicit destination; set oci_to (blank is refused, there is no default)"
            exit 1
          fi
          case "${oci_to,,}" in
            *go-pkgx*) echo "::error::publishing requires an explicit destination; go-pkgx is refused as one, got $oci_to"; exit 1 ;;
          esac
          dist_from=${IN_DIST_FROM:-oci://ghcr.io/go-zpkg/packages}
          case "${dist_from,,}" in
            *go-pkgx*) echo "::error::dist_from: go-pkgx is refused; dependencies resolve from go-zpkg and the run's own staging registry only, got $dist_from"; exit 1 ;;
          esac
          ref=${IN_OVERLAY_REF:-main}
          for v in "$oci_to" "$dist_from"; do
            case "$v" in
              oci://*) ;;
              *) echo "::error::'$v' is not an oci:// registry"; exit 1 ;;
            esac
            case "$v" in
              *[!A-Za-z0-9./:_@-]*) echo "::error::registry '$v' holds a character outside A-Za-z0-9./:_@-"; exit 1 ;;
            esac
          done
          case "$ref" in
            -*|*..*|*[!A-Za-z0-9._/-]*) echo "::error::overlay_ref '$ref' is not a branch, tag or SHA"; exit 1 ;;
          esac
          # The production key signs ONE destination, spelled exactly. One
          # that merely names go-zpkg is refused, with either key.
          # (Whether the key EXISTS is the publish job's to say: this job holds no
          # secret, so it cannot read one, not even to test it for emptiness.)
          sign_prod=false
          case "$oci_to" in
            oci://ghcr.io/go-zpkg/packages)
              sign_prod=true ;;
            oci://ghcr.io/go-zpkg/smoke)
              # The one non-production go-zpkg destination: signed with the
              # non-production key, never the production one.
              sign_prod=false ;;
            *)
              case "${oci_to,,}" in
                *go-zpkg*) echo "::error::a destination naming go-zpkg must be exactly oci://ghcr.io/go-zpkg/packages (or oci://ghcr.io/go-zpkg/smoke), got $oci_to"; exit 1 ;;
              esac ;;
          esac
          {
            echo "SIGN_PROD=$sign_prod"
            echo "OCI_TO=$oci_to"
            echo "PUBLISH_TO=$oci_to"
            echo "DIST_FROM=$dist_from"
            echo "OVERLAY_URL=https://raw.githubusercontent.com/go-zpkg/recipes/$ref/projects"
            echo "OVERLAY_REF=$ref"
            echo "EXTRA_KEYS=$IN_EXTRA_KEYS"
          } >> "$GITHUB_ENV"
          echo "publish to $oci_to, read from $dist_from, overlay at $ref"

      # No credential is left in .git/config for the recipe code to find.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version: '1.27.4' }

      - name: build zpkb, pkgx and pkgm (static)
        run: |
          # This used to assemble the module path from a loop variable, so the
          # go-pkgx → go-zpkg rename pass (a rule table over literal text) did
          # not see it. Each module is spelled out now, which also means the
          # rename pass reads every one.
          #
          # Tags, not main: this job holds the signing and registry secrets
          # (go-zpkg/packages#440), and each pin is a line a test can read, a
          # bump a deliberate edit.
          CGO_ENABLED=0 go install github.com/go-zpkg/zpkb/cmd/zpkb@v0.106.0
          CGO_ENABLED=0 go install github.com/go-zpkg/zpkx@v0.40.4
          CGO_ENABLED=0 go install github.com/go-zpkg/zpkm@v0.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # A recorded commit, never a moving branch: the pantry's recipe scripts
      # run during the build. See build.yml's step of the same purpose.
      - name: clone pantry at the recorded commit
        env:
          PANTRY_REF: ${{ github.event.inputs.pantry_ref }}
        run: |
          set -eu
          ref=${PANTRY_REF:?pantry_ref is empty}
          case "$ref" in
            -*|*..*|*[!A-Za-z0-9._/-]*) echo "::error::pantry_ref '$ref' is not a branch, tag or SHA"; exit 1 ;;
          esac
          git init -q pantry
          git -C pantry fetch -q --depth 1 https://github.com/pkgxdev/pantry "$ref"
          git -C pantry checkout -q FETCH_HEAD
          echo "pantry $(git -C pantry rev-parse HEAD)"

      # ⛔ overlay_ref MUST REACH THE FACTORY AS A DIRECTORY TOO. ZPKG_RECIPES_OVERLAY
      # (a URL) only steers what the tool environment resolves; the closure the
      # factory orders and builds is widened by `--overlay <dir>`, which
      # builder/sovereign-build.sh passes only when $SOVEREIGN_OVERLAY is set.
      # This job never set it, so the 4th argument of the inner script was empty
      # (smoke run 45059582252: `+ overlay=`) and a dependency only the overlay
      # declares was left out of the closure. Pinned to the same ref as the URL.
      - name: clone the recipes overlay at overlay_ref
        env:
          OVERLAY_REF: ${{ env.OVERLAY_REF }}
        run: |
          set -eu
          ref=${OVERLAY_REF:?overlay_ref is empty}
          case "$ref" in
            -*|*..*|*[!A-Za-z0-9._/-]*) echo "::error::overlay_ref '$ref' is not a branch, tag or SHA"; exit 1 ;;
          esac
          git init -q overlay
          git -C overlay fetch -q --depth 1 https://github.com/go-zpkg/recipes "$ref"
          git -C overlay checkout -q FETCH_HEAD
          echo "overlay $(git -C overlay rev-parse HEAD)"

      # A directory, not an image: builder/README.md's primitive. --container
      # writes /etc/ld.so.conf listing every staged library directory, without
      # which /bin/sh inside the tree cannot find libc.
      # A zot pull-through cache runs on the pool host, bound to the Incus
      # bridge. Staging the toolchain pulls ~2 GiB (llvm.org alone is ~1.7), and
      # every job on this machine would otherwise pull it from ghcr again.
      # Detected rather than configured: a GitHub-hosted runner cannot reach
      # 10.46.81.1 and simply keeps ghcr. Signature verification is unaffected —
      # zot proxies the cosign referrer along with the artifact.
      - name: point at the pull-through cache if it answers
        run: |
          # The cache accelerates BLOB pulls only. It must not become ZPKG_DIST:
          # zot cannot serve the tag listing of a repository it has not synced
          # yet, so resolution falls back to the upstream dist, takes a version
          # string from there, and asks the cache for a tag our registry does not
          # use — `gnu.org/bash` is published as `5.3`, not `5.3.0`:
          #   install gnu.org/bash 5.3.0: …/gnu.org/bash:5.3.0: not found
          # Listing stays on ghcr; ZPKG_CACHE is consulted for the artifact itself.
          echo "ZPKG_DIST=$DIST_FROM" >> "$GITHUB_ENV"
          if curl -fsS -m 3 http://10.46.81.1:5111/v2/ >/dev/null 2>&1; then
            echo "pull-through cache answers — artifacts will be pulled through it"
            echo "ZPKG_CACHE=oci://http://10.46.81.1:5111/go-zpkg/packages" >> "$GITHUB_ENV"
          else
            echo "no cache on this runner — artifacts come straight from ghcr"
          fi

      - name: stage the sovereign rootfs
        env:
          ZPKG_RECIPES_OVERLAY: ${{ env.OVERLAY_URL }}
          ZPKG_EXTRA_TRUSTED_KEYS: ${{ env.EXTRA_KEYS }}
        run: |
          # ⛔⛔ `command -v pkgx` WOULD NOW FIND SOMEBODY ELSE'S PROGRAM.
          # Ours is `zpkx` since the rename, and `pkgx` is upstream's — a
          # different implementation that can sit on the same PATH, which is
          # the whole reason the rename happened. A lookup left as `pkgx`
          # does not fail loudly; it either finds nothing or finds upstream
          # and stages a rootfs with it.
          #
          # ⛔⛔ AND THIS NOTE BELONGS ABOVE THE COMMAND, NOT INSIDE IT. It sat
          # between `--toolchain …\` and `--zpkb …`, where a `#` line does NOT
          # comment out one line of a continued command: the backslash before
          # it is itself swallowed by the comment, so the continuation ENDS
          # there. `zpkb builder` then ran without `--zpkb`, `--zpkx` or
          # `--container`, and `--zpkb "$(command -v zpkb)"` ran as a COMMAND
          # — 127, step dead. Measured with a positive control: the same block
          # without the comment line passes every word to one command.
          # `actionlint` reports it as SC2215 and found four of these, all
          # written by a rename pass like the one that wrote this note.
          zpkb builder \
            --out "$RUNNER_TEMP/rootfs" \
            --platform "$PLATFORM" \
            --toolchain builder/toolchain.txt \
            --zpkb "$(command -v zpkb)" \
            --zpkx "$(command -v zpkx)" \
            --container
          du -sh "$RUNNER_TEMP/rootfs"

      - name: what the rootfs is made of
        run: |
          root="$RUNNER_TEMP/rootfs"
          echo "top level:"; ls "$root"
          # The claim to check is a negative one: no distribution in there.
          for d in usr/lib/x86_64-linux-gnu lib/x86_64-linux-gnu lib/aarch64-linux-gnu etc/debian_version etc/os-release; do
            [ -e "$root/$d" ] && echo "  UNEXPECTED: $d" || true
          done
          echo "the loader the tree will actually use:"
          ls -l "$root/lib64" "$root/lib" 2>/dev/null | grep -i "ld-linux" || true
          echo "glibc staged:"; find "$root" -maxdepth 5 -type d -name "glibc*" 2>/dev/null | head -3

      # ⛔ NO OCI_PASSWORD AND NO SIGNING_KEY HERE: this step runs recipe code.
      # It stages (`zpkb factory --stage-only`, inside builder/sovereign-build.sh)
      # and the step after it signs and pushes, holding the secrets and running
      # no recipe (secaudit finding 2).
      - name: build inside the rootfs
        env:
          # ⛔ NO OCI_* HERE. A username without its password is a HALF
          # credential, and ghcr.io refuses it (403) where an anonymous pull of a
          # public repository succeeds. The destination reaches the script as
          # PUBLISH_TO.
          # builder/Containerfile's ENV lines, not just its ENTRYPOINT. Without
          # ZPKG_DIR the chroot inherits pkgx's $HOME/.pkgx default, which
          # (a) re-downloads the toolchain the staged tree already holds and
          # (b) bakes PT_INTERP=/root/.pkgx/... into the artifact — an absolute
          # path no consumer has. Measured on the first artifact this job built.
          ZPKG_DIR: /zpkg
          HOME: /root
          ZPKG_RECIPES_OVERLAY: ${{ env.OVERLAY_URL }}
          ZPKG_EXTRA_TRUSTED_KEYS: ${{ env.EXTRA_KEYS }}
          # Our aarch64 pool is emulated by construction — the host is amd64 —
          # and qemu-user fakes uname AND /proc/cpuinfo, so nothing inside the
          # container can tell. The workflow knows, so it says.
          #
          # 16 GiB of reserved VA, not 4: rustc/LLVM exhausted 4 GiB compiling
          # the cargo crate itself —
          #   rustc-LLVM ERROR: out of memory
          #   qemu: uncaught target signal 6 (Aborted) - core dumped
          # after two and a half hours. This is ADDRESS SPACE, not resident
          # memory, so it costs nothing on a 64-bit host with 56 GiB free.
          #
          # QEMU_RESERVED_VA is what makes a build possible at all there: our
          # gnu.org/bash carries bash's own sbrk-based malloc, and under qemu's
          # default reserved address space it cannot allocate on the FIRST
          # command —
          #   /bin/sh: xmalloc: setlinebuf.c:51: cannot allocate 2016 bytes
          # Measured: our bash fails, the same bash with this set succeeds, and
          # the distribution's bash (--without-bash-malloc) never had it.
          #
          # JOBS is NOT that fix — lowering it to 4 changed nothing, which is
          # what showed the allocation failure was never memory pressure. It
          # stays because 32 concurrent qemu processes on a shared pool is
          # simply a poor trade.
          QEMU_RESERVED_VA: ${{ github.event.inputs.arch == 'aarch64' && '0x400000000' || '' }}
          JOBS: ${{ github.event.inputs.arch == 'aarch64' && '4' || '' }}
          RECIPES: ${{ github.event.inputs.recipes || 'lz4.org' }}
          VERSIONS: ${{ github.event.inputs.versions || '=1.10.0' }}
          # Without this the first green run reported "0 built, 15 skipped —
          # already published": the whole chain ran and compiled nothing.
          FORCE: ${{ github.event.inputs.force || '1' }}
        run: |
          SOVEREIGN_OVERLAY="$PWD/overlay" \
          SOVEREIGN_ADVISORIES="$PWD/advisories" \
          builder/sovereign-build.sh \
            "$RUNNER_TEMP/rootfs" "$PWD/pantry" "$PWD/overrides" \
            ${VERSIONS:+--versions "$VERSIONS"}

      # Declares what the build staged: the tree's digest and the publish lane.
      # The `publish` job refuses unless the tree it downloads has this digest.
      # No secret is read here.
      - name: digest the staged tree
        id: digest
        run: |
          set -eu
          stage="$RUNNER_TEMP/rootfs/dist"
          [ -f "$stage/publish-plan.json" ] || { echo "::error::the build staged nothing: no publish-plan.json in $stage"; exit 1; }
          sudo chmod -R a+rX "$stage" 2>/dev/null || chmod -R a+rX "$stage"
          digest=$(go run ./distdigest "$stage")
          lane=$(go run ./inputcheck --lane "$OCI_TO")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          echo "staged tree $digest, publish lane $lane"

      - name: upload dist tree
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sovereign-dist-${{ github.event.inputs.arch || 'x86-64' }}
          path: ${{ runner.temp }}/rootfs/dist
          if-no-files-found: warn

      # The smoke registry (oci://http://10.46.81.1:5111) is not reachable from a
      # GitHub-hosted runner, so it keeps a path that needs no secret: this job
      # pushes UNAUTHENTICATED and UNSIGNED. Nothing signed is produced there.
      - name: publish to the LAN registry, unsigned and unauthenticated
        if: steps.digest.outputs.lane == 'lan'
        run: |
          zpkb publish-stage "$RUNNER_TEMP/rootfs/dist" --to "${OCI_TO:?publishing requires an explicit destination}" --advisories "$PWD/advisories" --allow-unsigned

  # ⛔ THE ONLY JOB HERE THAT HOLDS THE KEY AND THE TOKEN. It runs on an ephemeral
  # GitHub-hosted runner, runs no recipe, and signs only a tree whose digest
  # equals the one the build job declared. Actions are pinned by SHA.
  publish:
    needs: sovereign
    if: needs.sovereign.outputs.lane == 'hosted'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version: '1.27.4' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sovereign-dist-${{ github.event.inputs.arch || 'x86-64' }}
          path: ${{ runner.temp }}/dist

      # The destination and the extra trusted keys are re-validated here, from
      # the dispatch again and by the same Go program the build workflow uses:
      # only exactly oci://ghcr.io/go-zpkg/packages gets the go-zpkg key, and a
      # go-zpkg destination without that key is refused. Nothing the build job
      # says reaches the signing step except the digest it is checked against.
      - name: validate the destination and export it
        env:
          IN_OCI_TO: ${{ github.event.inputs.oci_to }}
          IN_EXTRA_KEYS: ${{ github.event.inputs.extra_trusted_keys }}
          HAVE_ZPKG_KEY: ${{ secrets.ZPKG_SIGNING_KEY != '' }}
        # --publish-env: this job builds nothing, so it is not handed the build's
        # OVERLAY_URL, DIST_FROM or SEED_* (publish-stage reads none of them).
        run: go run ./inputcheck --publish-env

      - name: verify the downloaded tree against the build job's digest
        env:
          DECLARED: ${{ needs.sovereign.outputs.digest }}
        run: go run ./distdigest --verify "$DECLARED" "$RUNNER_TEMP/dist"

      - name: build zpkb
        run: |
          CGO_ENABLED=0 go install github.com/go-zpkg/zpkb/cmd/zpkb@v0.106.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: sign and publish what the build staged
        env:
          OCI_USERNAME: ${{ github.actor }}
          OCI_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          # SIGN_PROD is `true` only for exactly oci://ghcr.io/go-zpkg/packages,
          # which gets ZPKG_SIGNING_KEY or nothing; every other destination
          # keeps the old key. Two guarded halves rather than `a && X || Y`,
          # which would hand Y (the old key) to go-zpkg whenever X is empty.
          SIGNING_KEY: ${{ (env.SIGN_PROD == 'true' && secrets.ZPKG_SIGNING_KEY) || (env.SIGN_PROD != 'true' && secrets.ARTIFACT_SIGNING_KEY) || '' }}
          ZPKG_EXTRA_TRUSTED_KEYS: ${{ env.EXTRA_KEYS }}
        run: |
          set -eu
          unsigned=
          [ -n "$SIGNING_KEY" ] || unsigned=--allow-unsigned
          # shellcheck disable=SC2086  # one flag or nothing
          zpkb publish-stage "$RUNNER_TEMP/dist" --to "${OCI_TO:?publishing requires an explicit destination}" --advisories "$PWD/advisories" $unsigned
