name: ci

# The Go in this repo is not a side-show: `catalog` IS the index-audit gate that
# runs at 04:00 and fails the day a published artifact drops out of its index,
# `browsergw` is the CORS front the browser package store talks through, and
# `openssl3` generates the override patches the factory applies. Until this lane
# existed, nothing compiled or tested any of it before merge — a change that
# broke `go run ./catalog` would have been discovered by the audit, in
# production, at four in the morning.

on:
  push: { branches: [main] }
  pull_request:

permissions: { contents: read }

env:
  # Deps from the module proxy, OUR modules straight from GitHub. `GOPROXY=direct`
  # alone made the bootstrap depend on every vanity-import host in the closure,
  # and gopkg.in's hours of 502s on 2026-10-12 failed the darwin lane twice
  # having built nothing. Measured, and kept uniform across the workflows, by
  # ./goproxycheck.
  GOPROXY: https://proxy.golang.org,direct
  GONOPROXY: github.com/go-zpkg/*

jobs:
  # ⛔ NOTHING HERE HAD EVER ASKED — about OUR OWN CODE. vulnscan.yml asks a
  # database about the packages we PUBLISH; this asks about the Go in this
  # repository, which is a different question and had no answer at all.
  #
  # Scanned by hand on 2026-10-18 with the toolchain the `go` directive then
  # permitted -- go1.27.1 -- this module had 23 findings, NINE of them
  # reachable:
  #
  #   GO-2026-6611 stdlib.Write       GO-2026-6603 stdlib.FlushError
  #   GO-2026-6617 stdlib.Write       GO-2026-6613 stdlib.Get
  #   GO-2026-6612 stdlib.ServeConn   GO-2026-6605 stdlib.Do
  #   GO-2026-6610 stdlib.NewClientConn
  #   GO-2026-6607 stdlib.Read        GO-2026-6608 stdlib.ReadMIMEHeader
  #
  # One more than its siblings, and `stdlib.ServeConn` says why: browsergw is
  # an HTTP SERVER, so this tree has an inbound path the others do not.
  #
  # Raising the directive to 1.27.2 and golang.org/x/net to v0.60.0 took it
  # to 1 — a notice with no released fix.
  vuln:
    name: govulncheck, judged by vulngate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version: '1.27.4' }
      # ⛔ NO `set -o pipefail` and no bare exit status: govulncheck exits
      # non-zero over findings it has decided are NOT called, and zero over
      # some it has, which is the whole reason vulngate exists. The emptiness
      # check is the other half — a scan that wrote nothing must not read as
      # nothing found. Scanner @latest, judge pinned: the scanner should know
      # about an advisory published this morning, the verdict should not
      # change under the repository without a commit.
      - name: govulncheck, judged by vulngate
        run: |
          set -eu
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/go-fleettools/fleettools/cmd/vulngate@v0.23.0
          BIN="$(go env GOPATH)/bin"
          "$BIN/govulncheck" -format json ./... > "$RUNNER_TEMP/vuln.json" || true
          test -s "$RUNNER_TEMP/vuln.json" || { echo "::error::govulncheck wrote nothing at all"; exit 1; }
          "$BIN/vulngate" -go "$(go env GOVERSION)" "$RUNNER_TEMP/vuln.json"

  # A workflow that triggers on `pull_request` must NOT run on a self-hosted
  # runner. For that event GitHub runs the workflow file from the PR's HEAD, so
  # a fork can add a job naming any label it likes and execute its code on our
  # machines. The label is not a boundary.
  #
  # This used to say [self-hosted, incus, amd64] — 32 cores, an ephemeral
  # container per job — and the speed was real. It is not worth the exposure:
  # `go vet`, gofmt and `go test` on this tree fit a hosted runner, and the
  # pool stays for build.yml, which is workflow_dispatch and schedule only.
  #
  # The default fork-PR policy on a public repository is "require approval for
  # first-time contributors", which does NOT close this: a contributor whose
  # first PR was merged then runs without approval. Moving off self-hosted
  # removes the intersection instead of gating it.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version: '1.27.4' }
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      # ⛔ NO WORKFLOW ASKS pkgx FOR A VERB THAT IS pkgs'S.
      #
      # go-zpkg/pkgx#113 moved nine verbs to a second binary. The sweep
      # missed this repository, and vulnscan.yml went on running `pkgx
      # catalog update` — caught five hours later by pkgx's own refusal, on
      # the first scheduled run, in a job whose value is being believed when
      # it is green.
      #
      # It reads comments too: this tree's workflows carry more explanation
      # than command, and a stale comment teaches the old spelling.
      - name: no workflow asks pkgx for a pkgs verb
        run: go run ./verbcheck

      # The overrides are HCL now, and say WHAT they change rather than where
      # the lines are — so "it stopped applying" has become three answers
      # instead of one: the recipe needed it, upstream has caught up (delete
      # it), or what it edits is gone (an error). The last two were spelled the
      # same by a unified diff, and 3 of 231 had silently stopped on
      # 2026-09-24, among them the -Werror switch mozilla.org/nss needs, whose
      # absence cost two rebuilds and a duplicate fix for a defect that was
      # already fixed.
      #
      # Eight *.patch files remain and are a different thing entirely: they
      # CREATE a project, so they are recipes of ours, not overrides.
      #
      # `zpkb overrides` uses the applier the BUILDER uses — overrides.Apply, on
      # go-gitdiff — and that is the whole point of running it rather than
      # `git apply --check`. git searches for a patch's context with an offset
      # and go-gitdiff does not, so the two disagree: on 2026-09-27 git passed
      # a patch the builder refused, and it was merged.
      #
      # The advisory records are the factory's own answer to "why was this
      # rebuilt?", and `zpkb publish --advisories` attaches them to the artifact as
      # an OpenVEX document. A record that does not parse is therefore not a
      # documentation problem: it STOPS a publish, in the middle of a factory
      # run, hours in.
      #
      # It also catches the one mistake the format cannot defend itself
      # against: a file copied from a neighbouring project and only half
      # edited. `zpkb advisories` refuses a file whose `project:` disagrees with
      # its directory, because nothing else in the record says which package it
      # is about — and the findings would be attached, signed, to the wrong
      # artifact.
      #
      # An EMPTY tree fails too, which is deliberate: a validator that cannot
      # find its corpus reports the same "no problems" as one that read it all.
      - name: every advisory record is usable
        run: |
          go run github.com/go-zpkg/zpkb/cmd/zpkb@main advisories \
            --dir advisories --list

      # A FRESH clone every time, because a patch already applied does not
      # apply twice.
      - name: every override still applies
        run: |
          rm -rf "$RUNNER_TEMP/pantry"
          git clone --depth 1 https://github.com/pkgxdev/pantry "$RUNNER_TEMP/pantry"
          # GONOPROXY (workflow env:): a proxy-cached `@main` can be an older
          # zpkb, and "unknown subcommand" is a confusing way to learn that.
          go run github.com/go-zpkg/zpkb/cmd/zpkb@main overrides \
            --dir overrides --recipe-dir "$RUNNER_TEMP/pantry"

      # The step above leaves a pantry with every override applied — which is
      # the recipe the FACTORY builds. The overlay is the recipe a CONSUMER
      # resolves from, and for the 183 projects in both, the overlay wins
      # entirely. So the two can part, and 25 of them have.
      #
      # This gates only the half a consumer reads — `dependencies`, `provides`,
      # `versions`, `distributable`. The other 23 are our own override patches
      # showing through, and nothing reads a build section out of the overlay;
      # failing on those would mean mirroring every patch into a second tree
      # forever.
      #
      # It exists because one consumer-side difference was live and served:
      # tcl-lang.org enumerated versions from a page listing only what upstream
      # currently recommends, while its own distributable downloaded from
      # SourceForge — the inconsistency upstream's pantry had been corrected
      # for. It had been reported for as long as the tool existed, as
      # `..build.script: 15 items became 14`, because the comparison returned
      # the first difference in sorted key order and `build` sorts first.
      # The overrides are being moved from unified diffs to the logical HCL
      # form (go-zpkg/zpkb#226): a diff says WHERE lines are and stops applying
      # when upstream edits a neighbour, while an override that says WHAT it
      # changes is addressed by key. 3 of 231 diffs had silently stopped
      # applying on 2026-09-24, and one that `git apply --check` accepted was
      # refused by the builder and merged broken on 2026-09-27.
      #
      # The conversion is done, so this now reports "nothing to convert" and
      # passes. It stays because it is the net under the next unified diff
      # anybody adds: it derives the operations from the patch, writes them
      # out, READS THEM BACK, applies them to a pristine recipe, and demands
      # the same document the patch produced — and demands that applying them
      # TWICE changes nothing, which is the property 24 operations across 22
      # projects failed before go-zpkg/zpkb#229.
      #
      # It clones its own pantry rather than reusing the one above, which by
      # this point has been patched.
      - name: any unified diff left is convertible, and the conversion is faithful
        run: go run ./logicalise

      # A project upstream does not carry lives in ONE place now: the overlay,
      # which zpkb builds from and a consumer resolves from (go-zpkg/zpkb#231). It
      # used to live in two — a patch that created the recipe, and the overlay
      # — and four such projects were published, signed and unreachable to any
      # consumer because only the build half existed. Nothing said so: the
      # artifacts were there, and only a RECIPE fetch would have failed.
      #
      # That risk is not gone, it has moved: the overlay's copy has to be
      # SERVED. A checkout can be right while the contents API still returns
      # the old state — raw.githubusercontent holds a file for minutes and
      # nothing dislodges it — so this asks the API for the eight, and compares
      # the other 175 against the recipe the factory builds.
      # A `why` that points at the git history is not a why. The converter's
      # fallback wrote one for every override it could not map to a generated
      # family, and 59 of the 206 carried it — 29% of the directory telling the
      # reader to go to the one place nobody looks. Every one of them was
      # recoverable: `git log --diff-filter=A -- overrides/<name>.patch` had the
      # reason, often in the subject line alone.
      #
      # The format exists to carry the WHY beside the WHAT. This is the crudest
      # possible check of that and it is still worth having, because the way
      # the placeholder came back would be a tool writing it, not a person.
      - name: no override defers its reason to the git history
        run: |
          if grep -l "the reason is in the git history" overrides/*.hcl; then
            echo "::error::the overrides above say where to look instead of saying why."
            echo "Recover it: git log --diff-filter=A --all -- overrides/<name>.patch"
            exit 1
          fi
          echo "$(ls overrides/*.hcl | wc -l) override(s), none deferring its reason"

      - name: the half a consumer resolves from agrees
        # ⛔⛔ THE TOKEN IS NOT A CONVENIENCE HERE. This step asks the contents
        # API once per project that upstream does not carry, and it passed no
        # token at all, so it spent the UNAUTHENTICATED budget: 60 requests an
        # hour per source address. On 2026-11-15, with 37 such projects, every
        # one came back 403 and overlaycheck printed "the overlay does not
        # SERVE it" about 37 recipes that were all served — the same command
        # run locally, tokenless, got 200 for all 37. The checker now refuses
        # to call a 403 a verdict; this makes the 403 stop happening.
        # Read-only `contents: read` is all it needs, which the workflow
        # already grants.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf "$RUNNER_TEMP/overlay"
          git clone --depth 1 https://github.com/go-zpkg/recipes "$RUNNER_TEMP/overlay"
          # --overrides, because the pantry on disk is no longer the recipe
          # the factory builds: the logical overrides are applied as a recipe
          # is READ and change nothing on the filesystem. Without it this
          # compared the overlay against an UNOVERRIDDEN recipe and reported
          # 180 disagreements, every one of them ours.
          go run ./overlaycheck --pantry "$RUNNER_TEMP/pantry" --overlay "$RUNNER_TEMP/overlay" --overrides overrides

      # ⛔ UNDER A SEED A RECIPE CANNOT CALL zpkx ITSELF. A seed pass gives the
      # build environment of another registry and a nested `zpkx +tool` has no
      # seed access by design, so every tool a recipe needs must be a declared
      # build dependency. A recipe that calls it works on a normal build and
      # fails closed under a seed, in the middle of pass 1. This reads the recipes
      # of the toolchain roots (builder/toolchain.txt) and go.dev, in the overlay
      # and in the pantry the factory builds from, and names the line.
      # The two checkouts are printed by SHA: the verdict belongs to those trees.
      - name: no seed-pass root recipe invokes zpkx itself
        run: |
          git -C "$RUNNER_TEMP/overlay" rev-parse HEAD
          git -C "$RUNNER_TEMP/pantry" rev-parse HEAD
          go run ./zpkxcensus --recipes "$RUNNER_TEMP/overlay/projects" --recipes "$RUNNER_TEMP/pantry/projects" --projects-from builder/toolchain.txt --project go.dev

      # ⛔⛔ A STANDALONE RECIPE RETIRES ITS OVERRIDES IN SILENCE.
      # Since zpkb v0.90.0 (go-zpkg/zpkb#514) a standalone recipe in
      # go-zpkg/recipes is the WHOLE recipe, so the logical override for the same
      # project is no longer applied, and nothing failed: 29 of 217 overrides
      # were dead when go-zpkg/zpkb#516 counted them, seven of them carrying a
      # fix the recipe did not (selinux linked into find, tar and gettext; the
      # darwin rpath for texinfo's XS modules; glibc's GCONV_PATH; ...).
      #
      # This step reads both trees with the tool that made that count. It runs on
      # this repository's pull requests, so an override edit is judged against the
      # recipes as they are on main; a recipe that turns a project standalone is
      # judged here the next time this lane runs, and its author is told which
      # override to carry or delete.
      #
      # ⚠ WITHOUT --require-live-overrides FOR NOW, ON PURPOSE. The four that
      # were dead when this was written (llvm.org, rust-lang.org,
      # rust-lang.org/cargo, openprinting.github.io/cups) are classified and
      # deleted in this change; the list was empty for them, and then three more
      # recipes of other work went standalone the same afternoon (kerberos.org,
      # openjpeg.org, info-zip.org/zip), each with an override whose fix its
      # author has to carry or retire. Without the flag the tool WARNS and lists
      # them in this step's log. ⭐ THE FLAG GOES ON THE DAY THAT LIST IS EMPTY,
      # which is a one-line change here: `lint` exits 1 on a dead override with it.
      - name: no standalone recipe silently retires a live override
        run: |
          rm -rf "$RUNNER_TEMP/recipes-live"
          git clone --depth 1 https://github.com/go-zpkg/recipes "$RUNNER_TEMP/recipes-live"
          go run github.com/go-zpkg/zpkb/cmd/zpkb@v0.91.0 lint \
            --dir "$RUNNER_TEMP/recipes-live" --overrides overrides

      # The seed order is a human artefact with a machine-checkable property.
      # An order over a graph with CYCLES is not a topological sort — there is
      # none — it is a topological sort of everything else plus a choice of
      # which edges to give up on. Inside a cycle that choice is unavoidable;
      # between two cycles nothing forces it, and this gates only the second.
      #
      # It is not a formality. The first run of it, 2026-09-28, found two:
      # rust-lang.org and rust-lang.org/cargo both ordered before llvm.org,
      # which is in a different component. That was the live seed failure of
      # that day — `cargo: resolve deps: GET .../llvm.org/.../versions.txt: Not
      # Found` — with two more cascading from it, and the file had been edited
      # by hand for weeks with nothing able to say so.
      # The seed reached 77 of 77 on 2026-09-29 and was not a usable
      # toolchain: the first build on top of it without --bootstrap died on
      # `no version of gnu.org/gawk satisfies "~5.3"`. The seed had built
      # 5.4.1 — the newest — and zpkb pins ~5.3 on purpose, because 5.4.1
      # mishandles autoconf's option-resolution scripts. The order named
      # projects and not versions, so it took the latest and nothing said
      # otherwise. "Every project published" was true and answered the wrong
      # question.
      #
      # The constraint is READ FROM zpkb (build.BaseToolchain), never copied:
      # a second "~5.3" in this repository would be right until zpkb moved and
      # then wrong silently, which is the same defect one layer up.
      #
      # TWO lists, because the same defect happened again on 2026-10-04 in the
      # other one. builder/toolchain.txt pinned kernel.org/linux-headers@~7.1;
      # the order named the project with no version, so the seed built 7.2.8,
      # and the first sovereign s390x build died in 22 seconds on
      #   no version of kernel.org/linux-headers satisfies "~7.1"
      # — exactly the shape this step refuses, which passed because it was
      # reading zpkb's list alone. A check aimed at one of two sources is worse
      # than none: it reports agreement.
      - name: the seed order builds the toolchain the toolchain wants
        run: go run ./seedpins --order seed/order.txt --builder-toolchain builder/toolchain.txt

      # Pinned to a zpkb TAG, not @main: the closure it walks is zpkb's, so a
      # zpkb change must not redden an unrelated PR (go-zpkg/packages#480).
      # Bump it deliberately, together with seed/order.txt.
      - name: the seed order honours every edge outside a cycle
        run: |
          go run github.com/go-zpkg/zpkb/cmd/zpkb@v0.97.0 closure --build \
            --check-order seed/order.txt \
            --recipe-dir "$RUNNER_TEMP/pantry" \
            --overlay "$RUNNER_TEMP/overlay" \
            --overrides overrides \
            $(grep -vE '^[[:space:]]*(#|$)' seed/order.txt | tr '\n' ' ')

      # The verdict comes from the PROFILE, not from `go tool cover -func`.
      # -func attributes every block to the enclosing function DECLARATION and
      # drops the ones that have none — the body of a package-level
      # `var f = func(){…}` — from its per-function list AND from the `total:`
      # line this step used to compare against "100.0%". On 2026-11-14 that
      # hid 12 uncovered statements behind a green 100.0%: npmtag's httpGet
      # and sonamesweep's runCmd, in each program the only code that opens a
      # socket or execs a child. One of the two was broken. See #458.
      - name: test + 100% coverage gate
        run: |
          go test ./... -covermode=atomic -coverprofile=cov.out
          go run ./covgate -profile cov.out

  # Same reason as `test` above: this workflow triggers on pull_request, so a
  # fork's own copy of this file decides where its code runs. A cross-compile
  # matrix is cheap; the pool is not worth the exposure.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
          - { goos: linux, goarch: loong64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version: '1.27.4' }
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }} (CGO=0)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  # ⛔⛔ THE WORKFLOWS THEMSELVES HAD NO GATE AT ALL, and four steps were dead
  # because of it. A `#` note written BETWEEN the continued lines of a shell
  # command does not comment out one line: the backslash that would continue
  # the command is swallowed by the comment, the continuation ends, and the
  # rest runs as its own command. `build.yml`, `sovereign.yml`, `wasip1-c.yml`
  # and `windows-c.yml` all carried that in their "stage the sovereign rootfs"
  # step — `--zpkb "$(command -v zpkb)"` executing as a COMMAND, 127 — put
  # there between 2026-11-04 and 2026-11-13 by rename passes adding a note.
  # Nothing went red: those are dispatch-and-schedule lanes whose last run
  # predated the edits. A defect in a lane nobody triggers is invisible until
  # the day it is needed, which for a factory is the day a build is wanted.
  #
  # shellcheck calls the class SC2215 and actionlint surfaces it. ./wflintgate
  # is the gate rather than a bare `actionlint` step for two measured reasons:
  # actionlint skips every shellcheck rule IN SILENCE when shellcheck is not on
  # PATH, and it takes FILES rather than a directory — handed one it answers
  # "is a directory", exits 3, and a step reading only "no output" calls that a
  # pass. The gate asserts shellcheck is present, proves itself against a
  # control carrying the defect AND one without it, prints how many files it
  # read, and treats any exit but 0 or 1 as "did not judge".
  #
  # A/B on 2026-11-15: 4 × SC2215 over the four workflows as they were, 0 over
  # the 17 as they are.
  workflows:
    name: actionlint, proved against a control
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version: '1.27.4' }
      # Pinned: the judge's verdict should not change under this repository
      # without a commit. shellcheck comes with the runner image, and the gate
      # refuses rather than skipping if it ever stops doing so.
      - name: actionlint, judged by ./wflintgate
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: go run ./wflintgate

  # The rule above, enforced. A guard that lives only in a comment is a guard
  # that is gone the next time somebody wants the 32 cores back.
  no-self-hosted-on-fork-triggers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: no workflow may combine pull_request with a self-hosted runner
        run: |
          set -euo pipefail
          bad=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$f" ] || continue
            # `pull_request` and `pull_request_target` both run fork-authored
            # code; the second is worse, since it gets repository secrets.
            grep -qE '^[[:space:]]*pull_request(_target)?:' "$f" || continue
            # Anchored on a real `runs-on:` key, not the substring: an
            # unanchored pattern matches this guard's own source and the check
            # fails on itself. Found by running it, not by reading it.
            grep -E '^[[:space:]]*runs-on:' "$f" | grep -q 'self-hosted' || continue
            echo "::error file=$f::$f triggers on pull_request AND runs on a self-hosted runner."
            echo "  For that event GitHub runs the workflow from the PR HEAD, so a fork"
            echo "  can name any label and execute on our machines. Use a hosted runner,"
            echo "  or move the job to a workflow_dispatch/schedule trigger."
            bad=1
          done
          [ "$bad" = 0 ] && echo "no workflow exposes a self-hosted runner to fork pull requests"
          exit "$bad"

  # A second pass runs recipe code with no network but the registry it reads.
  # This runs builder/sovereign-build.sh itself (stub zpkx/zpkb in a busybox
  # rootfs) and asserts the namespace: the allowed registry answers, another
  # loopback server, a public address and an unrouted one do not, and a pass
  # with no allow-list is refused. The darwin test suite can only read the
  # script's text; this is the job that proves it behaves.
  netns:
    name: second pass network namespace
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: install socat and a static busybox
        run: |
          sudo apt-get update
          sudo apt-get install -y socat busybox-static
      - name: builder/netns-test.sh
        run: |
          work="$(mktemp -d)"
          builder/netns-test.sh "$work"
