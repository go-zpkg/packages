name: darwin

# macOS artifacts for ghcr.io/go-pkgx/packages. Same pure-Go zpkb pipeline and the
# same signed-OCI registry as the linux factory (build.yml) — the ONLY difference
# is native macOS runners instead of a debian container (GitHub's macOS runners
# are already clean, ephemeral VMs, so they are the isolation). `zpkb factory` is
# platform-agnostic (PLATFORM=darwin/<arch>). The whole recipes.txt is chunked
# across both arches; macOS runner concurrency is scarce so max-parallel is low.
on:
  workflow_dispatch:
    inputs:
      recipes:
        description: "space-separated projects to build (blank = the whole recipes.txt, chunked)"
        required: false
        default: ""
      versions:
        description: "only consider versions matching this pkgx constraint. A BARE version is a RANGE — use '=1.2.3' for exactly one. Without it a targeted run walks EVERY version of the named projects, which on macOS runners costs hours and fails on the old ones."
        required: false
        default: ""
      max_versions:
        description: "cap versions per requested project, newest first (blank = all)"
        required: false
        default: ""
      no_closure:
        description: "build ONLY the projects named in recipes, not their dependency closure. For a REPAIR run: the dependencies are already published, and walking to them costs a version resolution each and can drag a toolchain in behind them."
        required: false
        default: ""
      rebuild:
        description: "`1` publishes a build of an ALREADY-PUBLISHED version as the next `_N` instead of replacing its tag — for a recipe fix that changes the binary without changing the upstream version. fftw gained SIMD codelets and went out as the same 3.3.11, so nothing could tell the two apart. NOT implied by a manual dispatch (which always forces): a counter minted on every retry would litter the registry. ⛔ upstream pkgx cannot parse `_N`, so a project carrying one is unreadable to an upstream client."
        required: false
        default: ""
      source_mirror:
        description: "keep every source archive this run downloads in this registry, addressed by its sha256. Blank = keep nothing. 57% of the pantry builds from tarballs GitHub GENERATES on request rather than stores, so for those it is the first stored artefact they have ever had."
        required: false
        default: "oci://ghcr.io/go-zpkg"
      arch:
        description: "restrict the matrix to one arch: blank = both, `x86-64`, `aarch64`. A targeted repair usually concerns one of them, and building the other reruns an hour of macOS runner for nothing — the openssl-v1 repairs ran on aarch64 while x86-64 stayed on the pre-repair version, so the two halves genuinely diverge."
        required: false
        default: ""
      mirror_from:
        description: "copy the artifacts from this upstream dist instead of building them, e.g. https://dist.pkgx.dev — the cheap way to restore a platform an index lost"
        required: false
        default: ""
      oci_to:
        description: "registry to PUBLISH to, `oci://host/repo`. REQUIRED: publishing requires an explicit destination; blank is refused, there is no default, and go-pkgx is refused as one. Exactly oci://ghcr.io/go-zpkg/packages is signed with secrets.ZPKG_SIGNING_KEY."
        required: true
  # schedule:  # cron disabled 2026-08-12 (free runners for targeted jobs; workflow_dispatch kept)
    # - cron: "0 7 * * *"

# Read-only by default. Only the `publish` job (GitHub-hosted, runs no recipe)
# gets `packages: write` and the signing keys; the macOS build jobs run
# third-party recipe code and hold no secret and no token that can write.
permissions:
  contents: read

env:
  CHUNK: "50"
  # Deps from the module proxy, OUR modules straight from GitHub. `GOPROXY=direct`
  # alone made the bootstrap depend on every vanity-import host in the closure,
  # and gopkg.in's hours of 502s on 2026-10-12 failed this lane twice having
  # built nothing. Measured, and kept uniform across the workflows, by
  # ./goproxycheck.
  GOPROXY: https://proxy.golang.org,direct
  GONOPROXY: github.com/go-zpkg/*

jobs:
  setup:
    # NOT the GARM/Incus pool, although the rest of our linux work runs there.
    #
    # This job only generates a matrix, and it GATES every macOS job behind it.
    # The pool is shared across the organisation, so a saturated pool holds up
    # macOS runners that were free the whole time. Measured 2026-09-24: three
    # darwin repairs dispatched between 14:19 and 14:46 had still not reached a
    # macOS runner at 17:24, because `setup` was queued for one of the pool's
    # seven amd64 runners and all seven were busy with other repositories.
    #
    # It is also faster here. On the pool this job took 1m20s to 3m, nearly all
    # of it apt-installing jq into a bare Debian cloud image; ubuntu-latest
    # ships jq and a git that checkout can use. The GitHub minutes are free for
    # a public repository, and the build jobs themselves stay where they are.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      # ubuntu-latest ships jq, so this is a no-op here. It is kept because the
      # job ran on the Incus pool's plain Debian cloud image until 2026-09-24
      # and would need it again if it ever moves back.
      - name: jq
        run: command -v jq >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends jq; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # ⛔ BOTH ARCHES ON ONE TOOLCHAIN GENERATION. aarch64 ran on `macos-14`
      # and x86-64 on `macos-15-intel`, so "the two darwin arches" were also
      # two Xcode generations, and a failure on one was as likely to be about
      # the compiler as about the architecture (#198).
      #
      # What it cost, measured 2026-10-12: `nodejs.org` 26.8.1 and 24.20.0
      # cannot be built for aarch64 at all —
      #
      #   deps/v8/src/base/memcopy.h:255: no member named 'atomic_ref' in namespace 'std'
      #
      # `std::atomic_ref` is C++20 library and macos-14's libc++ lacks it.
      # x86-64 published 26.10.0 from the newer image while aarch64 was stuck
      # on a 26.8.1 artifact that cannot even start (it links openssl v1, #330),
      # so the gap had gone from delaying a publish to FREEZING a defect.
      #
      # Safe for consumers because the deployment target is set by the builder,
      # not inherited from it: zpkb's wrapper exports MACOSX_DEPLOYMENT_TARGET=11.0
      # on every darwin build, so a newer host still produces macOS 11 artifacts.
      - id: gen
        env:
          IN_RECIPES: ${{ github.event.inputs.recipes }}
          IN_ARCH: ${{ github.event.inputs.arch }}
          IN_MIRROR_FROM: ${{ github.event.inputs.mirror_from }}
        run: |
          # A mirror copies artifacts from elsewhere and publishes them; the
          # staged path cannot do that without a credential, so it is refused
          # here, as build.yml's preflight refuses it (go-zpkg/packages#500).
          if [ -n "$IN_MIRROR_FROM" ]; then
            echo "::error::mirror_from is refused: this lane stages and the publish job pushes; a mirror copy needs its own credentialed lane"
            exit 1
          fi
          # Dispatch values are data, never script text, and are checked before
          # they reach a command: arch from a fixed set, recipes word by word
          # against the project-name pattern.
          case "$IN_ARCH" in
            ''|x86-64|aarch64) ;;
            *) echo "::error::arch must be blank, x86-64 or aarch64"; exit 1 ;;
          esac
          for r in $IN_RECIPES; do
            case "$r" in
              -*|*[!A-Za-z0-9._/+-]*) echo "::error::recipes entry '$r' is not a project name"; exit 1 ;;
            esac
          done
          if [ -n "$IN_RECIPES" ]; then
            m='{"include":[{"runner":"macos-15","platform":"darwin/aarch64","slug":"darwin-aarch64","chunk":"manual"},{"runner":"macos-15-intel","platform":"darwin/x86-64","slug":"darwin-x86-64","chunk":"manual"}]}'
          else
            total=$(grep -vcE '^[[:space:]]*(#|$)' recipes.txt)
            n=$(( (total + CHUNK - 1) / CHUNK ))
            m=$(jq -cn --argjson n "$n" '{include: [range(0;$n) as $c
              | ({runner:"macos-15",platform:"darwin/aarch64",slug:"darwin-aarch64"},
                 {runner:"macos-15-intel",platform:"darwin/x86-64",slug:"darwin-x86-64"})
              + {chunk:($c|tostring)}]}')
          fi
          # `arch` drops one half of the pair. The filter is on the slug, so an
          # unknown value yields an empty matrix rather than silently building
          # both — and the check below turns that into a refusal.
          ONLY="$IN_ARCH"
          m=$(echo "$m" | jq -c --arg only "$ONLY" \
            '{include: [.include[] | select($only == "" or (.slug | endswith($only)))]}')
          [ "$(echo "$m" | jq '.include | length')" -gt 0 ] || {
            echo "arch=$ONLY matched no platform (expected blank, x86-64 or aarch64)" >&2; exit 1; }
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "$m" | jq '.include | length | "\(.) build jobs"'

  build:
    needs: setup
    runs-on: ${{ matrix.runner }}
    # ⛔ This job runs recipe code. No secret, and a token that cannot write:
    # it stages (`zpkb factory --stage-only`), uploads the staged tree and
    # declares its digest; the `publish` job signs and pushes.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 6   # macOS runner concurrency is limited; keep the fan-out modest
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: base tools
        # macOS runners ship git, curl, xz, jq and the Xcode command-line tools
        # already. gettext is NOT taken from Homebrew: the base toolchain
        # carries gnu.org/gettext and zpkb puts it on the build PATH, measured on
        # a real build log —
        #
        #   PATH  20 entries under ~/.pkgx, 0 under /opt/homebrew or /usr/local
        #
        # so msgfmt comes from an artifact like every other tool. `brew install
        # gettext && brew link --force gettext` used to run here and was the
        # factory inviting the host in through the front door.
        run: |
          command -v python >/dev/null || ln -sf "$(command -v python3)" /usr/local/bin/python || true

      # ⛔⛔ WHICH TOOLCHAIN BUILT THIS, RECORDED WITH THE RUN.
      #
      # `macos-15` is a rolling label: it pins the macOS generation and the
      # Xcode inside it drifts. Measured 2026-11-03 by rebuilding
      # sourceware.org/bzip2 1.0.8 and comparing it with the artifact it
      # replaced — the SDK path baked into libbz2.a had moved from
      # Xcode_15.4.app to Xcode_16.4.app, and nothing in any log said so. It
      # was found by sweeping the ARTIFACT, which is the expensive way to learn
      # what your own builder is.
      #
      # This does not pin anything and changes no build. Pinning Xcode is the
      # real remedy for the drift and it is a decision with a bill: some
      # recipes may need 16.x, and darwin.yml already carries the scar of a
      # toolchain split (macos-14's libc++ has no `std::atomic_ref`). Record
      # first, so that decision can be made from data.
      #
      # ⛔ The SDK path is deliberately NOT rewritten out of the artifacts. It is
      # PROVENANCE: two builds against different SDKs produce different code,
      # and normalising the string would make them byte-identical in the one
      # place that recorded the difference — improving the reproducibility
      # metric by deleting its evidence. go-zpkg/zpkb#400.
      - name: the toolchain this run built with
        env:
          RUNNER_IMAGE: ${{ matrix.runner }}
        run: |
          set -eu
          echo "runner image  $RUNNER_IMAGE"
          xcodebuild -version 2>/dev/null || echo "xcodebuild: unavailable"
          echo "SDK path      $(xcrun --show-sdk-path)"
          echo "SDK version   $(xcrun --show-sdk-version)"
          echo "clang         $(cc --version | head -1)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version: '1.27.4' }

      # Publishing requires an explicit destination: oci_to is required, a blank
      # one is refused, there is no default, and go-pkgx is refused as one.
      # `inputcheck` decides it once for every lane and writes PUBLISH_TO and
      # SIGN_PROD to $GITHUB_ENV.
      - name: validate the destination
        env:
          IN_OCI_TO: ${{ github.event.inputs.oci_to }}
        # No HAVE_ZPKG_KEY, hence --no-key-check: this job reads no secret;
        # the `publish` job reads the key's presence.
        run: go run ./inputcheck --no-key-check

      # OUR pkgx, not upstream's — the same choice build.yml makes, and for the
      # same reason. Upstream resolves from its own bundled pantry and its own
      # dist, so neither overrides/ nor ZPKG_RECIPES_OVERLAY reaches it: zpkb asks
      # for `+perl.org~5.42` (the pin texinfo's XS modules need), upstream
      # intersects it with ITS idea of openssl's `perl.org: 5`, and answers
      #   Error: "no intersection possible for perl.org"
      # with no way to correct the recipe it was reading. That is not one
      # recipe: the toolchain is common to all of them, so on 2026-09-01 it
      # failed EVERY project in the batch, on both arches, in a run GitHub
      # reported as successful.
      - name: install pkgx (zpkb sources its toolchain via `pkgx +deps`)
        run: |
          go install github.com/go-zpkg/zpkx@main
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: install zpkb
        run: |
          go install github.com/go-zpkg/zpkb/cmd/zpkb@main
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: clone pantry
        run: git clone --depth 1 https://github.com/pkgxdev/pantry

      # For the CATALOGUE step at the end. The overlay names projects the
      # upstream pantry does not, and a catalogue built from the pantry
      # alone would complete onto a smaller world than this lane resolves
      # against.
      - name: clone the pantry overlay
        run: |
          git clone --depth 1 https://github.com/go-zpkg/recipes overlay
          echo "overlay $(git -C overlay rev-parse HEAD)"

      - name: hide the host's libraries from the build
        # zpkb already strips Homebrew from PATH, CPATH, LIBRARY_PATH,
        # PKG_CONFIG_PATH, CMAKE_PREFIX_PATH and LD_LIBRARY_PATH — measured, 0
        # entries in all six. It is not enough, and twice in one afternoon a
        # artifact was refused because of it:
        #
        #   openjpeg  bin/opj_compress -> /opt/homebrew/opt/little-cms2/lib/liblcms2.2.dylib
        #   gawk      bin/gawk         -> /usr/local/opt/mpfr/lib/libmpfr.6.dylib
        #
        # No environment variable governs that. CMake and the macOS linker
        # search /usr/local and /opt/homebrew because those prefixes are built
        # INTO them, and an autoconf probe that finds a header there simply
        # succeeds. The gawk one is the warning: had it linked mpfr statically,
        # the two architectures would have shipped different features with no
        # signal at all — our guard only catches a leak that leaves a path.
        #
        # The linux lane has never had this class, and not by luck: it builds
        # inside the FROM-scratch rootfs that builder/toolchain.txt names, so
        # the host's libc and compiler take no part. There is no FROM-scratch
        # macOS: the frameworks, the system libraries and the linker are
        # Apple's and live on the host. Nix reaches the same wall and turns its
        # sandbox OFF on macOS by default; Homebrew, on this exact ground,
        # answers by stripping the environment — which is the half we already
        # do.
        #
        # So: move the search surface aside for the length of the build. Only
        # lib/ and include/ — bin/ stays, so the runner's own tools keep
        # working — and only on a runner that is thrown away afterwards.
        run: |
          for p in /opt/homebrew /usr/local; do
            for d in lib include; do
              [ -d "$p/$d" ] || continue
              sudo mv "$p/$d" "$p/$d.hidden-for-build" && echo "hidden: $p/$d"
            done
          done

      - name: build + stage this chunk
        env:
          PLATFORM: ${{ matrix.platform }}
          # zpkb resolves a project's versions from api.github.com, and sends
          # `Authorization: Bearer $GITHUB_TOKEN` when it has one. Without it
          # the calls are ANONYMOUS — 60 requests an hour against a workflow
          # that resolves one project after another — and the run fails partway
          # through on something that is not a build problem at all:
          #
          #   curl.se 8.20 (darwin/aarch64) — build failed: resolve version:
          #     releases https://api.github.com/repos/curl/curl/releases: 403
          #     rate limit exceeded
          #
          # Measured 2026-09-04: a six-project repair run lost two of them this
          # way. The token the job already holds for the registry raises the
          # ceiling to 5000/hour; it just was never handed to the build. The job
          # token is READ-ONLY (permissions block above).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSIONS: ${{ github.event.inputs.versions }}
          MAX_VERSIONS: ${{ github.event.inputs.max_versions }}
          SOURCE_MIRROR: ${{ github.event.inputs.source_mirror }}
          IN_RECIPES: ${{ github.event.inputs.recipes }}
          IN_NO_CLOSURE: ${{ github.event.inputs.no_closure }}
          IN_REBUILD: ${{ github.event.inputs.rebuild }}
          CHUNK_ID: ${{ matrix.chunk }}
          # Resolve from OUR signed registry and OUR overlay, exactly as the
          # linux lane does. Without these two the darwin artifacts were resolved
          # against upstream's dist and upstream's recipes — a different closure
          # from the one we publish, and the reason a recipe corrected in the
          # overlay (openssl ^1.1 → ^3) still failed here.
          ZPKG_DIST: oci://ghcr.io/go-zpkg/packages
          ZPKG_RECIPES_OVERLAY: https://raw.githubusercontent.com/go-zpkg/recipes/main/projects
        run: |
          # FORCE on a manual dispatch, exactly as build.yml does. Without it a
          # dispatch SKIPS the version it was asked for whenever that version is
          # already published — and then walks BACKWARDS through every older
          # version instead, which is not what anyone asking for a rebuild means.
          #
          # Measured on 2026-09-02: three projects dispatched to relink against
          # openssl 3 came back "successful" having rebuilt none of them, with a
          # 130-line failure list of 2014-era cargo releases nobody asked for,
          # after two hours of runner time. The artifacts that had to change kept
          # their digests, so the recipes they block stayed blocked.
          for r in $IN_RECIPES; do
            case "$r" in
              -*|*[!A-Za-z0-9._/+-]*) echo "::error::recipes entry '$r' is not a project name"; exit 1 ;;
            esac
          done
          case "$IN_NO_CLOSURE$IN_REBUILD" in
            *[!A-Za-z0-9]*) echo "::error::no_closure and rebuild must be short alphanumeric switches"; exit 1 ;;
          esac
          FORCE=""
          if [ "$CHUNK_ID" = "manual" ]; then
            RECIPES="$IN_RECIPES"
            FORCE=1
          else
            case "$CHUNK_ID" in ''|*[!0-9]*) echo "::error::chunk '$CHUNK_ID' is not a number"; exit 1 ;; esac
            start=$(( CHUNK_ID * CHUNK + 1 )); end=$(( start + CHUNK - 1 ))
            RECIPES="$(grep -vE '^[[:space:]]*(#|$)' recipes.txt | sed -n "${start},${end}p" | tr '\n' ' ')"
          fi
          # shellcheck disable=SC2086  # RECIPES is intentionally word-split to count projects
          echo "chunk $CHUNK_ID →$(printf '%s\n' $RECIPES | grep -c .) requested projects${FORCE:+ (FORCE rebuild)}"
          # RECIPES, NO_CLOSURE and PLATFORM are read from the env by `zpkb factory` itself.
          NO_CLOSURE="$IN_NO_CLOSURE"
          # REBUILD is NOT derived from FORCE. A manual dispatch always forces,
          # so deriving it would mint a `_N` on every retry of a lane that
          # failed at the publish step. It is asked for explicitly or not at all.
          REBUILD="$IN_REBUILD"
          export RECIPES NO_CLOSURE FORCE REBUILD
          # --advisories on EVERY lane, not just linux. A darwin artifact with no
          # OpenVEX document beside its SBOM is an artifact whose consumer has to
          # re-triage what we already decided — and a flag added to one lane is
          # the half-a-pair defect this repository has paid for before.
          # --stage-only: this job holds no key and no token that can push.
          # mirror_from is refused by `setup`, so no mirror flag is passed.
          zpkb factory --stage-only \
            --recipe-dir pantry \
            --overrides overrides \
            --overlay overlay \
            --advisories advisories \
            --to "$PUBLISH_TO" \
            --artifacts dist \
            ${VERSIONS:+--versions "$VERSIONS"} \
            ${MAX_VERSIONS:+--max-versions "$MAX_VERSIONS"} \
            ${SOURCE_MIRROR:+--source-mirror "$SOURCE_MIRROR"}

      # ⛔⛔ A NAMED DISPATCH THAT BUILT NOTHING IS A FAILED DISPATCH.
      #
      # build.yml has had this since 2026-10-04 and darwin never did — the
      # half-a-pair defect the comment above the factory call warns about,
      # sitting directly under it.
      #
      # Measured 2026-11-03: `recipes=github.com/ggml-org/llama.cpp` ended
      #   closure: skip github.com/ggml-org/llama.cpp: no recipe file
      #   === summary (darwin/aarch64): 0 built, 0 skipped, 0 failed ===
      # and the job was GREEN. The recipe lives in the overlay, which this
      # lane did not pass to `zpkb factory` (fixed above), so the closure could
      # not see it at all.
      #
      # ⛔ AND IT IS STRICTER THAN build.yml's, deliberately. That one fires on
      # "0 built AND something failed", which this case would still have
      # passed: the project was SKIPPED, not failed, so failures.txt was
      # empty. A manual dispatch here always sets FORCE=1, so "built nothing
      # because there was nothing to build" cannot be the explanation — 0
      # files in dist means the lane did not do what it was asked.
      - name: a named dispatch that built nothing
        if: github.event.inputs.recipes != ''
        run: |
          built=0
          [ -d dist ] && built=$(find dist -type f | wc -l | tr -d ' ')
          failed=0
          [ -s failures.txt ] && failed=$(grep -cvE '^[[:space:]]*$' failures.txt)
          echo "$built file(s) in dist, $failed failure(s)"
          if [ "$built" -eq 0 ]; then
            echo "::error::this dispatch named its recipes and published nothing ($failed recorded failure(s)) — a project the closure SKIPS for a missing recipe records no failure at all, so check the log for 'closure: skip'"
            [ -s failures.txt ] && cat failures.txt
            exit 1
          fi

      # The CATALOGUE for this platform: what `pkgs ls` and <TAB> read on a
      # Mac. darwin had none at all, so a Mac asking what exists got either
      # silence or linux's answer — and the two differ, which is the whole
      # reason a catalogue is published per platform.
      #
      # ONE chunk, because the catalogue is derived from the PANTRY and not
      # from what this job built, so every chunk would push the same bytes.
      # always(), because it describes what the pantry NAMES: a chunk that
      # built nothing has still read a complete pantry, and a catalogue
      # withheld on a red run goes stale exactly when someone is looking.
      #
      # It runs BEFORE the libraries go back, since it compiles nothing and
      # touches no host library — and after them would put it behind the
      # `if: always()` restore, where a failure in either reads as a failure
      # of the other.
      # (The catalogue is now published by the `publish` job below: it signs
      # and pushes, so it cannot run in this job.)

      # Declares what the build staged, for the `publish` job: the sha256
      # digest of the staged tree, or `none` when no plan was written.
      # `always()` so what a partly failed build staged is still published.
      - name: digest what the build staged
        id: digest
        if: always()
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/declare"
          echo none > "$RUNNER_TEMP/declare/digest.txt"
          if [ ! -f dist/publish-plan.json ]; then
            echo "nothing staged: no publish-plan.json in dist"
            exit 0
          fi
          digest=$(go run ./distdigest dist)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$digest" > "$RUNNER_TEMP/declare/digest.txt"
          echo "staged tree $digest"

      - name: declare the digest for the publish job
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: declare-${{ matrix.slug }}-${{ matrix.chunk }}
          path: ${{ runner.temp }}/declare/digest.txt
          if-no-files-found: ignore

      - name: upload the staged tree for publishing
        if: always() && steps.digest.outputs.digest != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: publish-${{ matrix.slug }}-${{ matrix.chunk }}
          path: dist
          if-no-files-found: error

      - name: put the host's libraries back
        # Always, so a failed build does not leave the runner half-dismantled
        # for the steps that upload its evidence — the failure list is the part
        # that matters most when a build goes wrong.
        if: always()
        run: |
          for p in /opt/homebrew /usr/local; do
            for d in lib include; do
              [ -d "$p/$d.hidden-for-build" ] || continue
              sudo mv "$p/$d.hidden-for-build" "$p/$d" && echo "restored: $p/$d"
            done
          done

      - name: upload dist tree
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-${{ matrix.slug }}-${{ matrix.chunk }}
          path: dist
          if-no-files-found: ignore

      - name: upload failures list
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: failures-${{ matrix.slug }}-${{ matrix.chunk }}
          path: failures.txt
          if-no-files-found: ignore

      # The linux lane uploads this and the darwin one did not, so reading WHY a
      # darwin recipe failed meant fetching the job log — the one API endpoint
      # that goes to zero first under a shared quota.
      - name: upload failure detail
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: failures-detail-${{ matrix.slug }}-${{ matrix.chunk }}
          path: failures-detail.txt
          if-no-files-found: ignore

  # ⛔ THE ONLY JOB HERE THAT HOLDS A SIGNING KEY AND A TOKEN THAT CAN WRITE,
  # and it runs no recipe. One leg per build leg, on an ephemeral GitHub-hosted
  # ubuntu runner: `zpkb publish-stage` reads the platform from the staged
  # plan (darwin/<arch>) and does no host-dependent work — it re-checks every
  # file against the plan, signs and pushes — so no macOS runner is needed, and
  # a cheaper, more plentiful runner is used. It downloads the tree the build
  # leg staged and REFUSES unless its sha256 digest equals the one the build
  # leg declared. Actions are pinned by SHA: this is the job a compromised
  # action would own.
  publish:
    needs: [setup, build]
    # `matrix` is not available in a job-level `if`: the per-leg condition is
    # DECLARED_DIGEST != 'none', tested by the steps below.
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version: '1.27.4' }

      # The build leg's declaration. A missing one is a failure, never a skip:
      # only an explicit `none`, written by a leg that staged nothing, skips.
      - name: download the build job's declaration
        id: declared
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: declare-${{ matrix.slug }}-${{ matrix.chunk }}
          path: ${{ runner.temp }}/declare

      # distdigest accepts `none` or one sha256 line and nothing else, so what
      # reaches the environment is a value.
      - name: read the declared digest
        run: |
          set -eu
          d=$(go run ./distdigest --declared "$RUNNER_TEMP/declare/digest.txt")
          echo "DECLARED_DIGEST=$d" >> "$GITHUB_ENV"
          if [ "$d" = none ]; then
            echo "the build leg declared none: nothing staged, publishing skipped"
          fi

      # The same destination validation the build job ran, from the same input;
      # it settles PUBLISH_TO and SIGN_PROD. Here the key's presence IS read: a
      # go-zpkg destination without it fails.
      - name: validate the destination
        if: always() && steps.declared.conclusion != 'skipped'
        env:
          IN_OCI_TO: ${{ github.event.inputs.oci_to }}
          HAVE_ZPKG_KEY: ${{ secrets.ZPKG_SIGNING_KEY != '' }}
        # --publish-env: this job builds nothing, so it is not handed the build's
        # OVERLAY_URL, DIST_FROM or SEED_* (publish-stage reads none of them).
        run: go run ./inputcheck --publish-env

      - name: download the staged tree
        if: env.DECLARED_DIGEST != 'none' && env.DECLARED_DIGEST != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: publish-${{ matrix.slug }}-${{ matrix.chunk }}
          path: ${{ runner.temp }}/stage

      # An empty or malformed declaration is a refusal, never "nothing to compare".
      - name: verify the downloaded tree against the build job's digest
        if: env.DECLARED_DIGEST != 'none' && env.DECLARED_DIGEST != ''
        run: go run ./distdigest --verify "$DECLARED_DIGEST" "$RUNNER_TEMP/stage"

      - name: install zpkb
        if: always() && env.PUBLISH_TO != ''
        run: |
          # The version build.yml's publish job installs; a tag, never a moving branch.
          CGO_ENABLED=0 go install github.com/go-zpkg/zpkb/cmd/zpkb@v0.105.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # `--to` is spelled here and must equal the plan's: the plan is input from
      # the side that ran recipes, so it does not choose the destination.
      - name: sign and publish what the build staged
        if: env.DECLARED_DIGEST != 'none' && env.DECLARED_DIGEST != ''
        env:
          PLATFORM: ${{ matrix.platform }}
          OCI_USERNAME: ${{ github.actor }}
          OCI_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          # The key follows the EFFECTIVE destination, as `inputcheck` decided
          # it: SIGN_PROD is `true` only for exactly oci://ghcr.io/go-zpkg/packages,
          # which gets ZPKG_SIGNING_KEY or nothing; every other destination
          # keeps the old key.
          SIGNING_KEY: ${{ (env.SIGN_PROD == 'true' && secrets.ZPKG_SIGNING_KEY) || (env.SIGN_PROD != 'true' && secrets.ARTIFACT_SIGNING_KEY) || '' }}
        run: |
          set -eu
          [ -n "$PUBLISH_TO" ] || { echo "::error::publishing requires an explicit destination; there is none"; exit 1; }
          unsigned=
          [ -n "$SIGNING_KEY" ] || unsigned=--allow-unsigned
          # shellcheck disable=SC2086  # one flag or nothing
          zpkb publish-stage "$RUNNER_TEMP/stage" --to "$PUBLISH_TO" --advisories "$PWD/advisories" $unsigned

      # The CATALOGUE for this platform: what `pkgs ls` and <TAB> read on a Mac.
      # Derived from the pantry (data, no recipe runs), so it is signed and
      # pushed from here. ONE chunk, because every chunk would push the same
      # bytes; always(), because it describes what the pantry NAMES, and a
      # catalogue withheld on a red run goes stale exactly when someone looks.
      - name: clone pantry
        if: always() && (matrix.chunk == '0' || matrix.chunk == 'manual') && env.PUBLISH_TO != ''
        run: git clone --depth 1 https://github.com/pkgxdev/pantry
      - name: clone the pantry overlay
        if: always() && (matrix.chunk == '0' || matrix.chunk == 'manual') && env.PUBLISH_TO != ''
        run: git clone --depth 1 https://github.com/go-zpkg/recipes overlay
      - name: publish the catalogue
        # success(), not always(): a catalogue is published only by a run in which
        # nothing failed (promo-r2 pushed an unsigned one after a failed build).
        if: success() && (matrix.chunk == '0' || matrix.chunk == 'manual') && env.PUBLISH_TO != ''
        env:
          PLATFORM: ${{ matrix.platform }}
          OCI_USERNAME: ${{ github.actor }}
          OCI_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ (env.SIGN_PROD == 'true' && secrets.ZPKG_SIGNING_KEY) || (env.SIGN_PROD != 'true' && secrets.ARTIFACT_SIGNING_KEY) || '' }}
          # zpkb catalog --publish pushes to $ZPKG_DIST: catalogue where it published.
          ZPKG_DIST: ${{ env.PUBLISH_TO }}
        run: |
          set -eu
          zpkb catalog \
            --recipe-dir pantry \
            --overlay overlay \
            --overrides overrides \
            --versions \
            --platform "$PLATFORM" \
            --publish
