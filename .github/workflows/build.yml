name: build
on:
  workflow_dispatch:
    inputs:
      recipes:
        description: "space-separated projects to build (blank = the whole recipes.txt, chunked)"
        required: false
        default: ""
      max_versions:
        description: "cap versions per requested project, newest first (blank = all). Use 1 for a lean latest-only fill."
        required: false
        default: ""
      glibc:
        description: "build the whole closure against this exact glibc, e.g. 2.27.0 (blank = the container's). Publishes tools under <version>-glibc<ver>."
        required: false
        default: ""
      versions:
        description: "only consider versions matching this pkgx constraint, e.g. ^3 — the handle for an OLD line, which max_versions (newest-first) can never reach."
        required: false
        default: ""
      lock:
        description: "path to a `zpkb lock` file IN THIS REPOSITORY (e.g. locks/seed.lock.hcl). Builds exactly the versions it pins — every pin, not just its roots — and overrides `recipes`, the chunking and `versions`. A lock is the whole set: this is how a build is made to be the SAME build later, which plain re-dispatch is not. The same pantry commit 2df061bd resolved tcl to 9.0.4 and then to 9.1.0 four hours apart."
        required: false
        default: ""
      clean_build_root:
        description: "`1` removes the whole zpkb build root before starting. zpkb drops a tree once its artifact is published (go-zpkg/zpkb#217), but what a run INHERITS from earlier ones it cannot drop — and a seed on a small machine dies on that litter, reporting `no space left on device` against whichever project asked next. Destructive: a FAILED build's tree is kept on purpose, and this discards those too, so use it when the disk matters more than the last failure's evidence. It removes the OLD root too (`~/.local/share/brewkit`, zpkb's spelling before v0.80.0): our runners are long-lived, so that litter is still on their disks and nothing else will ever reclaim it."
        required: false
        default: ""
      pin_to_dependents:
        description: "`1` holds each REQUESTED project to the constraints its dependents place on it, as a closure-only dependency already is. For a SEED, where every project is named and none would otherwise be held to anything: gnu.org/glibc asks for gnu.org/gcc 14, and a seed naming gcc built 16.2.0 — twenty-five minutes of compiling for a version nothing could use. Leave blank for a repair run: naming a project is how you say `this version, whatever else wants`."
        required: false
        default: ""
      no_closure:
        description: "build ONLY the projects named in recipes, not their dependency closure. For a REPAIR run: the dependencies are already published, and walking to them costs a version resolution each and can drag a toolchain in behind them."
        required: false
        default: ""
      rebuild:
        description: "`1` publishes a build of an ALREADY-PUBLISHED version as the next `_N` instead of replacing its tag — for a recipe fix that changes the binary without changing the upstream version. fftw gained SIMD codelets and went out as the same 3.3.11, so nothing could tell the two apart. NOT implied by `force`: a counter minted on every retry would litter the registry. ⛔ upstream pkgx cannot parse `_N`, so a project carrying one is unreadable to an upstream client."
        required: false
        default: ""
      runner:
        description: "where to run: blank = our GARM/Incus pool for BOTH arches (no GitHub minutes; aarch64 is emulated); `github` = both arches on GitHub's runners."
        required: false
        default: ""
      arch:
        description: "restrict the matrix to one arch: blank = x86-64 AND aarch64, or name one of `x86-64`, `aarch64`, `s390x`. A manual dispatch forces a rebuild by default (see `force`), so healing one arch's gaps without this reruns the others for nothing. s390x is OPT-IN — it is absent from the blank set until its toolchain is published, because adding an architecture with no artifacts to every nightly buys a matrix of failures nobody reads."
        required: false
        default: ""
      force:
        description: "blank = a manual dispatch REBUILDS every project it names, even one already published, which is what healing a stale artifact needs. `0` skips the ones already in the dist, so a list can mean `build what is MISSING from this` — the question a bootstrap asks on every pass, and the only way to ask it today was to work out the answer beforehand by reading logs."
        required: false
        default: ""
      sovereign:
        description: "blank = build inside the FROM-scratch rootfs `zpkb builder` stages, so neither the host's libc nor its compiler takes part. `0` falls back to the runner's distribution. Ignored when mirror_from is set, which compiles nothing and would stage a toolchain for no reason."
        required: false
        default: ""
      source_mirror:
        description: "keep every source archive this run downloads in this registry, addressed by its sha256. Blank = keep nothing. 57% of the pantry builds from tarballs GitHub GENERATES on request rather than stores, so for those it is the first stored artefact they have ever had."
        required: false
        default: "oci://ghcr.io/go-zpkg"
      seed_dist:
        description: "read AND publish to this registry instead of ghcr, e.g. oci://127.0.0.1:5000/seed. For BOOTSTRAPPING an architecture nothing publishes: artifacts made against a host distribution must not reach the real registry, so they go to a throwaway one on the runner and never leave it. Blank = ghcr, as always."
        required: false
        default: ""
      bootstrap:
        description: "`1` builds WITHOUT zpkb's base toolchain in the environment, taking those tools from the host. The base toolchain is a cycle with no entry point — every build is handed all fifteen of its members as artifacts — so on an architecture with no artifacts at all, nothing can be built first. Use it ONLY with seed_dist, and only for the first generation: rebuild everything inside the sovereign rootfs afterwards."
        required: false
        default: ""
      test_only:
        description: "`1` builds NOTHING: run each named project's own `test:` block against the version already in the registry, and record the outcome in tests.txt. The factory tests an artifact when it publishes it and never again, so this is the only way to notice one that STOPPED working — a dependency whose signature went bad takes every consumer down silently (go-zpkg/zpkb#250)."
        required: false
        default: ""
      mirror_from:
        description: "copy the artifacts from this dist instead of building them — republished signed + attested (used for the glibc sweep). Blank, as it should normally be: this builds. The example here used to name an upstream pkgx dist, which we are no longer compatible with and do not copy from."
        required: false
        default: ""
      require_origin:
        description: "`1`, with mirror_from, PROMOTES instead of mirrors: zpkb refuses any artifact whose provenance does not prove the host toolchain was unused, and carries the source's verdict forward. How a sovereign seed reaches go-zpkg/packages. Blank or `1` only."
        required: false
        default: ""
      oci_to:
        description: "registry to PUBLISH to, `oci://host/repo`. REQUIRED (or seed_dist, or test_only): publishing requires an explicit destination, blank is refused and there is no default; go-pkgx is refused as one. A destination naming go-zpkg is signed ONLY with secrets.ZPKG_SIGNING_KEY and the run fails when that secret is empty; the old key never signs there. Not with seed_dist (go-zpkg/packages#440)."
        required: false
        default: ""
      dist_from:
        description: "registry the toolchain and dependencies are READ from, `oci://host/repo`. Blank = oci://ghcr.io/go-zpkg/packages; go-pkgx is refused. When oci_to is set, the run reads its own staging registry (oci_to) first and this one second, so a dependent of an artifact staged earlier in the run resolves it. Not with seed_dist, which already names one registry for both."
        required: false
        default: ""
      overlay_ref:
        description: "go-zpkg/recipes branch, tag or SHA the overlay is read from. Blank = main, a moving ref; pass a SHA to make a run reproducible."
        required: false
        default: "main"
      pantry_ref:
        description: "pkgxdev/pantry commit the recipes are read from. Its recipe scripts run during the build, so the default is a recorded SHA and a newer pantry is a deliberate bump, not whatever HEAD is at the minute of the run. A branch, tag or SHA, validated like overlay_ref (go-zpkg/packages#440)."
        required: false
        default: "1879069619956097ab80525b9c27ad15f1f07229"
      extra_trusted_keys:
        description: "extra public keys this run TRUSTS when it installs or verifies, exported as ZPKG_EXTRA_TRUSTED_KEYS to the steps that install or verify: whitespace-separated `name:RW<base64>` entries (go-zpkg/artifact trust.go ParseSigners), at most 8. Blank, as it should normally be. How generation 1 of a bootstrap verifies what generation 0 signed with a throwaway seed key. Refused with a destination naming go-zpkg: a promotion into go-zpkg must not widen trust (go-zpkg/packages#440)."
        required: false
        default: ""
      source_trusted_keys:
        description: "TRUST FOR THE SOURCE ONLY: public keys believed when a promotion (mirror_from + require_origin) verifies the SEED artifacts it copies and their origin claims: whitespace-separated `name:RW<base64>` entries, at most 8. Passed to the mirror step alone as `--source-trust`. Never exported to the publish job, an install, a test or the catalogue, never recorded as trust in what is promoted, and what clients trust is unchanged. Allowed with a destination naming go-zpkg, which extra_trusted_keys is not. Refused without mirror_from and require_origin."
        required: false
        default: ""
  # Continuous population: rebuild recipes.txt daily. skip-if-published means
  # only new/updated (project,version,platform) are actually built.
  # schedule:  # cron disabled 2026-08-12 (free runners for targeted jobs; workflow_dispatch kept)
    # - cron: "0 6 * * *"

# Read-only by default. Only the `publish` job below, on an ephemeral
# GitHub-hosted runner, asks for `packages: write`: a job on the long-lived
# self-hosted pool runs recipe code and must not hold a token that can write
# (secaudit finding 14).
permissions:
  contents: read

env:
  CHUNK: "50"   # projects per matrix job (chunked so the full pantry fans out)
  # Deps from the module proxy, OUR modules straight from GitHub. `GOPROXY=direct`
  # alone made the bootstrap depend on every vanity-import host in the closure,
  # and gopkg.in's hours of 502s on 2026-10-12 failed the darwin lane twice
  # having built nothing. Measured, and kept uniform across the workflows, by
  # ./goproxycheck.
  GOPROXY: https://proxy.golang.org,direct
  GONOPROXY: github.com/go-zpkg/*

jobs:
  # ⛔ THE ONLY PLACE BEFORE `publish` THAT READS A SECRET, even to test it for
  # emptiness, and it runs on an ephemeral GitHub-hosted runner. `setup` and
  # `build` run on the long-lived self-hosted pool and hold NO secret: they call
  # inputcheck with --no-key-check, and this job is what refuses a go-zpkg
  # destination when the signing key is absent. A dispatch that is refused here
  # takes no self-hosted runner at all.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # A mirror_from dispatch is a STAGED promotion (go-zpkg/packages#500): the
      # build job runs `zpkb factory --mirror-from --require-origin
      # --stage-only`, which downloads and VERIFIES the seed artifacts and signs
      # nothing, and the hosted `publish` job signs what it staged. inputcheck
      # below refuses mirror_from without require_origin, and the hosted publish
      # refuses a staged mirror whose plan does not record that verification.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version: '1.27.4' }
      - name: dispatch inputs are well formed and consistent
        env:
          IN_OCI_TO: ${{ github.event.inputs.oci_to }}
          IN_DIST_FROM: ${{ github.event.inputs.dist_from }}
          IN_OVERLAY_REF: ${{ github.event.inputs.overlay_ref }}
          IN_SEED_DIST: ${{ github.event.inputs.seed_dist }}
          IN_REQUIRE_ORIGIN: ${{ github.event.inputs.require_origin }}
          IN_MIRROR_FROM: ${{ github.event.inputs.mirror_from }}
          IN_SOURCE_MIRROR: ${{ github.event.inputs.source_mirror }}
          IN_GLIBC: ${{ github.event.inputs.glibc }}
          IN_VERSIONS: ${{ github.event.inputs.versions }}
          IN_EXTRA_KEYS: ${{ github.event.inputs.extra_trusted_keys }}
          IN_SOURCE_KEYS: ${{ github.event.inputs.source_trusted_keys }}
          IN_LOCK: ${{ github.event.inputs.lock }}
          IN_RECIPES: ${{ github.event.inputs.recipes }}
          IN_MAX_VERSIONS: ${{ github.event.inputs.max_versions }}
          IN_FORCE: ${{ github.event.inputs.force }}
          IN_REBUILD: ${{ github.event.inputs.rebuild }}
          IN_NO_CLOSURE: ${{ github.event.inputs.no_closure }}
          IN_PIN_TO_DEPENDENTS: ${{ github.event.inputs.pin_to_dependents }}
          IN_CLEAN_BUILD_ROOT: ${{ github.event.inputs.clean_build_root }}
          IN_BOOTSTRAP: ${{ github.event.inputs.bootstrap }}
          IN_TEST_ONLY: ${{ github.event.inputs.test_only }}
          IN_SOVEREIGN: ${{ github.event.inputs.sovereign }}
          HAVE_ZPKG_KEY: ${{ secrets.ZPKG_SIGNING_KEY != '' }}
        # Not --check-only: it also exports PUBLISH_LANE, read just below.
        run: go run ./inputcheck
      # Which lane the dispatch publishes through (none, lan or hosted): the
      # `publish` job is skipped unless it is `hosted`, so a smoke run against
      # the LAN registry does not start forty empty hosted legs.
      - name: publish lane
        id: lane
        run: echo "lane=${PUBLISH_LANE:?inputcheck exported no lane}" >> "$GITHUB_OUTPUT"
    outputs:
      lane: ${{ steps.lane.outputs.lane }}

  # Split recipes.txt into CHUNK-sized slices and emit a matrix over both linux
  # arches × every chunk, so the whole pantry is built best-effort in parallel.
  # A manual `recipes` input bypasses chunking (one job per arch with just those).
  setup:
    needs: preflight
    permissions:
      contents: read
    # The matrix generator has to run somewhere too: when GitHub's pool is the
    # thing that is unavailable, pinning this to ubuntu-latest queues the whole
    # workflow before it has decided anything.
    runs-on: ${{ github.event.inputs.runner == 'github' && 'ubuntu-latest' || fromJSON('["self-hosted","incus","amd64"]') }}
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      # GitHub's images carry jq; our Incus runner image does not, and the
      # matrix generator is written in it. One apt line beats rewriting the
      # generator in shell.
      - name: jq
        run: command -v jq >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends jq; }
      # Contradictory inputs, refused BEFORE a runner is taken. `bootstrap`
      # means "there is no base toolchain on this architecture yet, take the
      # tools from the host"; the sovereign rootfs is staged by RESOLVING that
      # same toolchain from a dist. Asking for both is asking for a toolchain
      # that does not exist, and what came back was
      #
      #   builder: resolve closure: GET https://dist.pkgx.dev/gnu.org/glibc/linux/s390x/versions.txt: Not Found
      #
      # ninety seconds into a job on the s390x runner — an error naming glibc,
      # which had done nothing wrong, for a contradiction stated in the inputs.
      # `sovereign` is not flipped silently: an input that quietly means
      # something else is worse than one that is refused.
      # Refused rather than reinterpreted, for the reason the note above
      # gives. --test-only compiles nothing, so it wants a staged toolchain as
      # little as mirroring does — and builder/sovereign-build.sh does not
      # pass the flag through, so that lane would quietly BUILD what the
      # operator asked only to test.
      #
      # Deciding the lane from this input instead would have meant testing it
      # here as `= 1` while zpkb reads it through envBool, which also accepts
      # `true`. Two readings of one value, disagreeing on exotic input, is
      # the silent divergence this repository keeps finding.
      - name: a test-only dispatch stages no toolchain
        env:
          TEST_ONLY: ${{ github.event.inputs.test_only }}
          SOVEREIGN: ${{ github.event.inputs.sovereign }}
        run: |
          [ -n "$TEST_ONLY" ] || exit 0
          [ "$SOVEREIGN" = 0 ] || {
            echo "::error::test_only=$TEST_ONLY builds nothing, so the sovereign rootfs would be staged for a run that compiles nothing — and sovereign-build.sh does not pass --test-only through, so it would BUILD instead. Pass sovereign=0 with it."
            exit 1
          }

      # Refused BEFORE a runner is taken. The same check runs again in `build`,
      # which also writes the validated values to $GITHUB_ENV; this copy only
      # decides. ⛔ A destination naming go-zpkg needs the go-zpkg key, and the
      # old key never signs there (go-zpkg/packages#440).
      #
      # Every dispatch input is checked by `inputcheck` (a Go program with
      # tests), in both jobs, so the two cannot disagree: character sets,
      # newlines and control characters refused, the effective destination (the
      # one `zpkb factory --to` publishes to, after the blank-oci_to fallback)
      # tested for go-zpkg, extra_trusted_keys checked entry by entry.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version: '1.27.4' }
      # No HAVE_ZPKG_KEY: this job holds no secret. `preflight` read it.
      - name: dispatch inputs are well formed and consistent
        env:
          IN_OCI_TO: ${{ github.event.inputs.oci_to }}
          IN_DIST_FROM: ${{ github.event.inputs.dist_from }}
          IN_OVERLAY_REF: ${{ github.event.inputs.overlay_ref }}
          IN_SEED_DIST: ${{ github.event.inputs.seed_dist }}
          IN_REQUIRE_ORIGIN: ${{ github.event.inputs.require_origin }}
          IN_MIRROR_FROM: ${{ github.event.inputs.mirror_from }}
          IN_SOURCE_MIRROR: ${{ github.event.inputs.source_mirror }}
          IN_GLIBC: ${{ github.event.inputs.glibc }}
          IN_VERSIONS: ${{ github.event.inputs.versions }}
          IN_EXTRA_KEYS: ${{ github.event.inputs.extra_trusted_keys }}
          IN_SOURCE_KEYS: ${{ github.event.inputs.source_trusted_keys }}
          IN_LOCK: ${{ github.event.inputs.lock }}
          IN_RECIPES: ${{ github.event.inputs.recipes }}
          IN_MAX_VERSIONS: ${{ github.event.inputs.max_versions }}
          IN_FORCE: ${{ github.event.inputs.force }}
          IN_REBUILD: ${{ github.event.inputs.rebuild }}
          IN_NO_CLOSURE: ${{ github.event.inputs.no_closure }}
          IN_PIN_TO_DEPENDENTS: ${{ github.event.inputs.pin_to_dependents }}
          IN_CLEAN_BUILD_ROOT: ${{ github.event.inputs.clean_build_root }}
          IN_BOOTSTRAP: ${{ github.event.inputs.bootstrap }}
          IN_TEST_ONLY: ${{ github.event.inputs.test_only }}
          IN_SOVEREIGN: ${{ github.event.inputs.sovereign }}
        run: go run ./inputcheck --check-only --no-key-check

      - name: a bootstrap dispatch states its two companions
        env:
          BOOTSTRAP: ${{ github.event.inputs.bootstrap }}
          SOVEREIGN: ${{ github.event.inputs.sovereign }}
          MAX_VERSIONS: ${{ github.event.inputs.max_versions }}
        run: |
          [ -n "$BOOTSTRAP" ] || exit 0
          [ "$SOVEREIGN" = 0 ] || {
            echo "::error::bootstrap=$BOOTSTRAP stages no toolchain, so the sovereign rootfs cannot be built from one. Pass sovereign=0 with it."
            exit 1
          }
          # `max_versions` blank means ALL versions, which is right for a
          # nightly and catastrophic for a seed: dispatched without it, a
          # 76-project bootstrap started down zlib.net's entire release
          # history — 1.2.5.2, 1.2.6, 1.2.7, … — on a host toolchain, and was
          # 191 builds in when it was cancelled. A seed makes an architecture
          # BUILDABLE; every historical version of every project is not that.
          [ -n "$MAX_VERSIONS" ] || {
            echo "::error::bootstrap=$BOOTSTRAP with max_versions blank means every version of every project. Pass max_versions=1 for a seed, or state a number."
            exit 1
          }
      # Dispatch inputs reach the shell as ENVIRONMENT, never interpolated into
      # the script text: a value stays a value.
      - id: gen
        env:
          IN_RUNNER: ${{ github.event.inputs.runner }}
          IN_ARCH: ${{ github.event.inputs.arch }}
          IN_RECIPES: ${{ github.event.inputs.recipes }}
        run: |
          # Our own pool needs no `container:` — the Incus container IS the
          # controlled environment. It is debian TRIXIE (glibc 2.41), not
          # bookworm: the artifacts zpkb installs to build with are MIRRORED from
          # upstream and linked against whatever distro built them, and our own
          # gnu.org/coreutils 9.11 needs GLIBC_2.38. On bookworm (2.36) every
          # build died at
          #     env: /lib/*/libc.so.6: version `GLIBC_2.38' not found
          # — measured by running that exact binary in both distributions. The
          # 2.36 floor this comment used to claim was never real for a pool
          # build; only the mirror path, which compiles nothing, ever worked
          # here. A floor lower than the container's is what `--glibc` is for.
          #
          # The host is amd64, so its aarch64 pool runs an aarch64 rootfs under
          # qemu-user (binfmt_misc, flag C so setuid still works). Measured
          # against the native pool: a short gcc run costs ~37x, a long-running
          # binary ~3x — the gap is qemu's per-process start-up, which configure
          # scripts pay thousands of times. Pass `runner: github` for the arm
          # runners GitHub bills for when a recipe is too slow to emulate.
          SELF='{"runner":["self-hosted","incus","amd64"],"platform":"linux/x86-64","slug":"linux-x86-64","container":""}'
          # Our aarch64 pool is EMULATED (the host is amd64). qemu_va is what
          # makes a build possible there at all: our gnu.org/bash carries bash's
          # own sbrk-based malloc and cannot allocate under qemu's default
          # reserved address space. jobs is a separate, milder judgement — 32
          # concurrent qemu processes on a shared pool is a poor trade — and NOT
          # the fix for the allocation failure; lowering it alone changed
          # nothing. Native runners keep both defaults.
          SELFARM='{"runner":["self-hosted","incus","arm64"],"platform":"linux/aarch64","slug":"linux-aarch64","container":"","jobs":"4","qemu_va":"0x400000000"}'
          # ⛔ NO `container:` ON THE GITHUB LANES, AND NOTHING EVER CAME OUT
          # OF THEM WITH ONE. A GitHub container job has no CAP_SYS_ADMIN, so
          # builder/sovereign-build.sh died at
          #
          #   unshare: unshare failed: Operation not permitted
          #
          # measured 2026-10-25 on ubuntu-24.04-arm. The build needs a mount
          # and pid namespace and then `chroot`s into the rootfs it just
          # built (sovereign-build.sh:113,132), which a capability-stripped
          # container cannot do.
          #
          # What the container was for — "a pinned, controlled debian base
          # instead of the drifting runner host" — is largely provided by
          # that chroot: the compiler, the glibc and the PATH the build sees
          # all come from the sovereign rootfs, not from the job. What is
          # left outside it is STAGING, and `debian:stable-slim` is a
          # FLOATING TAG, so the pinning it offered staging was already
          # softer than the comment implies. The self-hosted lanes keep
          # their Incus image, which is the pinned base this was imitating.
          GH64='{"runner":"ubuntu-latest","platform":"linux/x86-64","slug":"linux-x86-64","container":""}'
          GHARM='{"runner":"ubuntu-24.04-arm","platform":"linux/aarch64","slug":"linux-aarch64","container":""}'
          # IBM Z. A LinuxONE VM with a self-hosted runner built by
          # IBM/action-runner-image-pz — actions/runner does not build for
          # s390x out of the box (it is .NET, and linux-s390x is community
          # supported with no Microsoft binaries), which is why the label set
          # is ours rather than a GitHub-hosted one.
          #
          # container "" like SELF: the VM IS the environment. gaplib's images
          # are Ubuntu 22.04/24.04 or CentOS 9, and the `base tools` step below
          # uses apt-get, so an Ubuntu image is the assumption.
          #
          # This is the FIRST big-endian target. x86-64, aarch64 and both
          # darwin arches are little-endian, so every recipe with a byte-order
          # bug has been invisible until now. That is the point of the lane and
          # also where its cost will be — not in this matrix entry.
          # jobs "" — this lane asks the MACHINE. It is the one lane whose host
          # is a VM we resize, and "4" was written for it while the machine had
          # 2 cores. An empty value means the build step takes the cap the
          # census computed: min(nproc, min(MemTotal, cgroup)/2 GiB).
          SELFZ='{"runner":["self-hosted","linux","s390x"],"platform":"linux/s390x","slug":"linux-s390x","container":"","jobs":""}'
          X64=$SELF; ARM=$SELFARM
          if [ "$IN_RUNNER" = github ]; then X64=$GH64; ARM=$GHARM; fi
          # `arch` drops one half of the pair. jq gets it as a string and
          # filters on the slug, so an unknown value yields an empty matrix
          # rather than silently building everything.
          ONLY="$IN_ARCH"
          if [ -n "$IN_RECIPES" ]; then
            m=$(jq -cn --argjson a "$X64" --argjson b "$ARM" --argjson z "$SELFZ" --arg only "$ONLY" \
              '{include: [($a, $b, $z) + {chunk:"manual"}
                          | select(if $only == "" then (.slug | endswith("s390x") | not)
                                   else (.slug | endswith($only)) end)]}')
          else
            total=$(grep -vcE '^[[:space:]]*(#|$)' recipes.txt)
            n=$(( (total + CHUNK - 1) / CHUNK ))
            m=$(jq -cn --argjson n "$n" --argjson a "$X64" --argjson b "$ARM" --argjson z "$SELFZ" --arg only "$ONLY" \
              '{include: [range(0;$n) as $c | ($a, $b, $z) + {chunk:($c|tostring)}
                          | select(if $only == "" then (.slug | endswith("s390x") | not)
                                   else (.slug | endswith($only)) end)]}')
          fi
          [ "$(echo "$m" | jq '.include | length')" -gt 0 ] || { echo "arch=$ONLY matched no platform (expected blank, x86-64, aarch64 or s390x)" >&2; exit 1; }
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "$m" | jq '.include | length | "\(.) build jobs"'

  # ⛔ NO SECRET IN THIS JOB, at any level, whichever runner the matrix picks: it
  # runs recipe code, and the self-hosted pool keeps its home directory between
  # jobs. It stages (`zpkb factory --stage-only`), uploads the staged tree and
  # declares its sha256 digest as a job output; the `publish` job signs and
  # pushes. The one credential left is the workflow's own GITHUB_TOKEN, and with
  # `contents: read` it can read this public repository and nothing else; zpkb
  # sends it to api.github.com to stay under the anonymous rate limit.
  # selfhostedsecrets_test.go fails on anything more.
  build:
    needs: setup
    permissions:
      contents: read
    # No job outputs: GitHub refuses a per-leg output key built from the matrix.
    # Each leg declares its digest in a `declare-<slug>-<chunk>` artifact instead.
    runs-on: ${{ matrix.runner }}
    # ⛔ 360 IS THE DEFAULT, AND IT IS NOT ENOUGH FOR AN EMULATED ARCH.
    # Measured 2026-10-23/24: `nodejs.org 26.12.1` for linux/aarch64 started
    # at 19:29:30Z and was cancelled at 01:34:31Z — six hours and five
    # minutes, the default job timeout plus its cleanup. Twelve of the
    # job's twenty-three steps had run; nothing had failed.
    #
    # That reads as a CI flake and is not one. The same recipe took under
    # an hour on x86-64: aarch64 in this pool is emulated, and a large C++
    # build there is simply slower than six hours. Left at the default,
    # node can never be rebuilt for that platform — which is what blocked
    # the remedy for six advisories in #344.
    #
    # Raised rather than removed: a job that hangs should still end, and
    # this one holds a runner the whole organisation shares.
    timeout-minutes: 720
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    # Phase A isolation: build inside a pinned, controlled debian base instead of
    # the drifting runner host — reproducible, no host-tool leakage, and a known
    # glibc floor. On our own Incus pool the container is EMPTY, because the
    # Incus container is already that environment and nesting one inside it would
    # need a docker daemon the runner image does not carry.
    container: ${{ matrix.container }}
    steps:
      - name: base tools
        run: |
          # In a container the job is root; on the self-hosted runner it is
          # `runner`, which is in the sudo group. Same step, either way.
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          $SUDO apt-get update -qq
          $SUDO apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils build-essential gettext jq python3
          # some recipes' configure looks for `python`
          command -v python >/dev/null || $SUDO ln -sf "$(command -v python3)" /usr/local/bin/python

      # No credential is left in .git/config for recipe code to find.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version: '1.27.4' }

      # OUR pkgx, not upstream's. Upstream resolves dependencies from its own
      # bundled pantry, so neither overrides/ nor ZPKG_RECIPES_OVERLAY reaches it:
      # zpkb passes `+perl.org~5.42` (the pin texinfo's XS modules need) and
      # upstream intersects it with ITS idea of openssl's `perl.org: 5`, answering
      # "no intersection possible for perl.org" — with no way to correct the
      # recipe it was reading. Ours honours the overlay, resolves from our signed
      # registry, and is the runtime we actually ship.
      - name: install pkgx (zpkb sources its toolchain via `pkgx +deps`)
        run: |
          # CGO_ENABLED=0: this same binary is copied INTO the sovereign rootfs,
          # which has no system libc. Built against the runner's glibc it cannot
          # start there at all —
          #   /usr/local/bin/zpkx: error while loading shared libraries:
          #     libc.so.6: cannot open shared object file
          #
          # A TAG, not main: this job holds the signing and registry secrets,
          # and a moving branch would run whatever it points at when the job
          # starts. A newer tool is a deliberate bump of this line (go-zpkg/packages#440).
          CGO_ENABLED=0 go install github.com/go-zpkg/zpkx@v0.40.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: install zpkb
        run: |
          # Static for the same reason as pkgx: zpkb is installed into the rootfs.
          # A tag, like zpkx above; the version go.mod links.
          CGO_ENABLED=0 go install github.com/go-zpkg/zpkb/cmd/zpkb@v0.106.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The pantry is a recorded commit, never a moving branch: its recipe
      # scripts run during the build, so which commit that is has to be a
      # decision somebody wrote down (the `pantry_ref` input, whose default is
      # a SHA) rather than a property of the minute the run started. The input
      # reaches the shell as environment and is validated like overlay_ref.
      - name: clone pantry at the recorded commit
        env:
          PANTRY_REF: ${{ github.event.inputs.pantry_ref }}
        run: |
          set -eu
          ref=${PANTRY_REF:?pantry_ref is empty}
          case "$ref" in
            -*|*..*|*[!A-Za-z0-9._/-]*) echo "::error::pantry_ref '$ref' is not a branch, tag or SHA"; exit 1 ;;
          esac
          git init -q pantry
          git -C pantry fetch -q --depth 1 https://github.com/pkgxdev/pantry "$ref"
          git -C pantry checkout -q FETCH_HEAD
          echo "pantry $(git -C pantry rev-parse HEAD)"

      # The overlay is the half a CONSUMER resolves from, and it declares edges
      # upstream does not: perl.org NEEDs libcrypt.so.1, our overlay names the
      # provider, upstream's recipe says nothing. Until go-zpkg/zpkb#224 the
      # factory's closure walk read the pantry alone, so such a provider was
      # never built while every consumer asked the registry for it — and the
      # s390x seed only worked because its order had been computed by hand with
      # `zpkb closure --build --overlay` and pasted in.
      #
      # It does NOT change what is compiled: `zpkb factory` still builds the
      # pantry's recipe with the overrides applied. It widens the closure.
      # It is cloned AT overlay_ref, the same ref OVERLAY_URL names, never at a
      # moving main: a dispatch that pinned a ref must build from that ref.
      - name: clone the pantry overlay
        env:
          IN_OVERLAY_REF: ${{ github.event.inputs.overlay_ref }}
        run: |
          ref="${IN_OVERLAY_REF:-main}"
          case "$ref" in
            -*|*..*|*[!A-Za-z0-9._/-]*) echo "refusing overlay_ref" >&2; exit 1 ;;
          esac
          git init -q overlay
          git -C overlay fetch -q --depth 1 https://github.com/go-zpkg/recipes "$ref"
          git -C overlay checkout -q FETCH_HEAD
          echo "overlay $ref $(git -C overlay rev-parse HEAD)"

      # The sovereign path: a rootfs assembled from OUR artifacts, entered with
      # chroot. The host then contributes three static Go binaries and a mount
      # namespace, and nothing it links against reaches the build. See
      # builder/README.md, and .github/workflows/sovereign.yml for the job that
      # proves one recipe end to end.
      # A zot pull-through cache runs on the pool host, bound to the Incus
      # bridge. Staging the toolchain pulls ~2 GiB (llvm.org alone is ~1.7), and
      # every job on this machine would otherwise pull it from ghcr again.
      # Detected rather than configured: a GitHub-hosted runner cannot reach
      # 10.46.81.1 and simply keeps ghcr. Signature verification is unaffected —
      # zot proxies the cosign referrer along with the artifact.
      # Unconditional: it only sets environment. A build that is NOT sovereign
      # still pulls its dependency artifacts from our registry, and gating this on
      # the sovereign path would quietly take the cache away from it.
      # The setup job refused the bad combinations; this step turns the inputs
      # into the three values later steps read. Inputs arrive as environment,
      # never interpolated into the script. OCI_TO stays EMPTY unless the
      # dispatch named one, so a run that did not is exactly what it was.
      # `inputcheck` refuses the whole dispatch before it writes a single line,
      # and writes only single-line, whitelisted values (OCI_TO, DIST_FROM,
      # OVERLAY_URL, SEED_DIST). Later steps read those from $GITHUB_ENV and
      # never the raw input.
      - name: validate the dispatch inputs and export them
        env:
          IN_OCI_TO: ${{ github.event.inputs.oci_to }}
          IN_DIST_FROM: ${{ github.event.inputs.dist_from }}
          IN_OVERLAY_REF: ${{ github.event.inputs.overlay_ref }}
          IN_SEED_DIST: ${{ github.event.inputs.seed_dist }}
          IN_REQUIRE_ORIGIN: ${{ github.event.inputs.require_origin }}
          IN_MIRROR_FROM: ${{ github.event.inputs.mirror_from }}
          IN_SOURCE_MIRROR: ${{ github.event.inputs.source_mirror }}
          IN_GLIBC: ${{ github.event.inputs.glibc }}
          IN_VERSIONS: ${{ github.event.inputs.versions }}
          IN_EXTRA_KEYS: ${{ github.event.inputs.extra_trusted_keys }}
          IN_SOURCE_KEYS: ${{ github.event.inputs.source_trusted_keys }}
          IN_LOCK: ${{ github.event.inputs.lock }}
          IN_RECIPES: ${{ github.event.inputs.recipes }}
          IN_MAX_VERSIONS: ${{ github.event.inputs.max_versions }}
          IN_FORCE: ${{ github.event.inputs.force }}
          IN_REBUILD: ${{ github.event.inputs.rebuild }}
          IN_NO_CLOSURE: ${{ github.event.inputs.no_closure }}
          IN_PIN_TO_DEPENDENTS: ${{ github.event.inputs.pin_to_dependents }}
          IN_CLEAN_BUILD_ROOT: ${{ github.event.inputs.clean_build_root }}
          IN_BOOTSTRAP: ${{ github.event.inputs.bootstrap }}
          IN_TEST_ONLY: ${{ github.event.inputs.test_only }}
          IN_SOVEREIGN: ${{ github.event.inputs.sovereign }}
        # No HAVE_ZPKG_KEY, hence --no-key-check: the key's presence was read by
        # `preflight` and is read again by `publish`; this job reads no secret.
        run: go run ./inputcheck --no-key-check

      # Decide ONCE whether this job is sovereign, in shell, and hand the answer
      # to every later step. Expressing one decision as two conditions is how
      # they drift: the step-level `if` and the shell branch disagreed, staging
      # was skipped while the build still chrooted, and the job died with
      #   chroot: failed to run command '/usr/local/bin/zpkx': No such file
      # (GitHub compares operands of different types as NUMBERS, so an omitted
      # input — null — equals the string '0'. The default case was the broken
      # one.) Shell has no such rule.
      # After the validation above, so nothing is written to $GITHUB_ENV
      # for a dispatch that is about to be refused.
      - name: decide the build path
        env:
          SOVEREIGN: ${{ github.event.inputs.sovereign }}
          MIRROR_FROM: ${{ github.event.inputs.mirror_from }}
        run: |
          if [ "$SOVEREIGN" = 0 ] || [ -n "$MIRROR_FROM" ]; then
            echo "building with the runner's distribution"
            echo "SOVEREIGN_ON=0" >> "$GITHUB_ENV"
          else
            echo "building inside the sovereign rootfs"
            echo "SOVEREIGN_ON=1" >> "$GITHUB_ENV"
          fi

      # SEED_DIST and DIST_FROM come from $GITHUB_ENV, written by `inputcheck`:
      # the validated spelling, never the raw input.
      - name: point at the pull-through cache if it answers
        run: |
          # The cache accelerates BLOB pulls only. It must not become ZPKG_DIST:
          # zot cannot serve the tag listing of a repository it has not synced
          # yet, so resolution falls back to the upstream dist, takes a version
          # string from there, and asks the cache for a tag our registry does not
          # use — `gnu.org/bash` is published as `5.3`, not `5.3.0`:
          #   install gnu.org/bash 5.3.0: …/gnu.org/bash:5.3.0: not found
          # Listing stays on ghcr; ZPKG_CACHE is consulted for the artifact itself.
          if [ -n "$SEED_DIST" ]; then
            # A bootstrap pass reads and writes ONE registry, and it is not
            # ghcr. No cache either: the cache fronts ghcr, and mixing the two
            # would let a real artifact answer a seed's question.
            echo "seeding into $SEED_DIST — ghcr is not consulted and not written"
            echo "ZPKG_DIST=$SEED_DIST" >> "$GITHUB_ENV"
            # And no signature verification against it.
            #
            # Not a workaround: a throwaway registry on LOOPBACK, written and
            # read by the same job on the same machine, is not a trust
            # boundary. Anyone able to tamper with 127.0.0.1:5000 can tamper
            # with the rootfs directly, so verifying there protects against
            # nothing while refusing everything — the second generation died
            # staging its rootfs on
            #   install zlib.net 1.3.2: verify zlib.net v1.3.2 (linux/s390x):
            #   artifact: … is unsigned (no signature referrer)
            # after the toolchain had resolved (42 packages) and before a line
            # was compiled.
            #
            # ANSWERED, 2026-10-04, by the probe in `record what this run
            # read`: the registry returns HTTP 404 on
            # /v2/<repo>/referrers/<digest>. It does not serve the Referrers
            # API at all, so zpkb signs and has nowhere to put the signature.
            # Not a push that fails quietly, and not a zpkb defect.
            #
            # Which makes this setting the right one for a second reason, not
            # only the loopback argument: a registry that cannot HOLD a
            # signature cannot be verified against, whatever one wishes.
            #
            # Exactly scoped: this is the branch where ghcr is neither read nor
            # written, so nothing signed is being accepted unchecked.
            # …and the argument above is about LOOPBACK, so check for it.
            #
            # This read `if [ -n "$SEED_DIST" ]` and nothing else, so ANY
            # seed_dist turned signature verification off — including a
            # remote one, which is exactly the trust boundary the paragraph
            # above argues does not exist. The reasoning was right and the
            # condition did not implement it.
            #
            # Nothing has ever dispatched a non-loopback seed_dist; the input
            # has carried `oci://127.0.0.1:5000/seed` every time. That is the
            # kind of gap that stays harmless until someone reaches for the
            # obvious next thing — a seed registry shared between two
            # architectures, say — and silently loses verification doing it.
            #
            # Not an error: a remote seed registry is a reasonable thing to
            # want. It simply has to EARN the artifacts it serves, like ghcr
            # does. If it cannot hold a signature it will say so at the first
            # install, which is a better failure than a silent one.
            # SEED_LOOPBACK is decided in Go, by `inputcheck` (isLoopbackRegistry):
            # the host is EXACTLY 127.0.0.1, [::1] or localhost, with at most a
            # numeric port. This was a shell glob, which also matched a host
            # that merely begins with 127 — no pattern is left here.
            if [ "$SEED_LOOPBACK" = true ]; then
              echo "verification off: a loopback throwaway registry is not a trust boundary"
              echo "ZPKG_VERIFY=0" >> "$GITHUB_ENV"
            else
              echo "::notice::seed_dist '$SEED_DIST' is not a loopback registry, so signature verification STAYS ON — the throwaway-registry argument does not reach it"
            fi
            exit 0
          fi
          # DIST_LIST is composed by `inputcheck`: the run's own staging registry
          # (oci_to) first, so dependents of an in-run artifact resolve it, then
          # the go-zpkg registry (dist_from). go-pkgx is refused there.
          echo "ZPKG_DIST=$DIST_LIST" >> "$GITHUB_ENV"
          if curl -fsS -m 3 http://10.46.81.1:5111/v2/ >/dev/null 2>&1; then
            echo "pull-through cache answers — artifacts will be pulled through it"
            echo "ZPKG_CACHE=oci://http://10.46.81.1:5111/go-zpkg/packages" >> "$GITHUB_ENV"
          else
            echo "no cache on this runner — artifacts come straight from ghcr"
          fi

      - name: stage the sovereign rootfs
        if: env.SOVEREIGN_ON == '1'
        env:
          ZPKG_RECIPES_OVERLAY: ${{ env.OVERLAY_URL }}
          MATRIX_PLATFORM: ${{ matrix.platform }}
          # Step-scoped: the steps that install or verify get the validated
          # extra keys, nothing else does (go-zpkg/packages#440).
          ZPKG_EXTRA_TRUSTED_KEYS: ${{ env.EXTRA_KEYS }}
        run: |
          # A tag, not main (go-zpkg/packages#440).
          CGO_ENABLED=0 go install github.com/go-zpkg/zpkm@v0.11.0
          # A SELF-HOSTED runner reuses $RUNNER_TEMP between jobs, and
          # artifact.InstallFor treats the mere EXISTENCE of <project>/v<ver> as
          # "already present":
          #
          #   if st, err := os.Stat(prefix); err == nil && st.IsDir() {
          #       return false, nil // already present
          #   }
          #
          # So a tree left half-written by a run that died mid-install is
          # indistinguishable from a complete one, and every later job
          # inherits it in silence. Measured on the s390x lane: four
          # successive pilots staged a gnu.org/glibc whose lib/glibc-2.44 held
          # TWO files — a real one has two hundred — because the first of them
          # died at `install zlib.net` and left that behind.
          #
          # The GitHub-hosted runners never showed it: their _temp is fresh.
          #
          # SUDO, because the tree is not ours to delete: the build runs under
          # `sudo unshare … chroot`, so everything it installed into the
          # rootfs's /zpkg belongs to root. A plain rm reported
          #   rm: cannot remove '…/rootfs/zpkg/lz4.org/v1.10.0/lib/liblz4.so':
          #   Permission denied
          # and `bash -e` ended the step before `zpkb builder` ran at all —
          # trading a silent stale tree for a loud refusal, which is better
          # but still not staging anything.
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          $SUDO rm -rf "$RUNNER_TEMP/rootfs"
          # Resolve first, and do not stop at the first gap. Staging refuses
          # on the first root it cannot resolve, which is right for a build
          # and useless for bringing an architecture up: each run then names
          # one missing package and the next is only visible once that one is
          # built. --dry-run names EVERY blocked root in the same seconds, and
          # prints it immediately above the refusal that follows.
          #
          # `|| true`: this is diagnosis, not the gate. The staging below is
          # the verdict, and a pre-flight that could fail a job the real step
          # would have passed is a second opinion nobody asked for.
          zpkb builder --dry-run \
            --platform "$MATRIX_PLATFORM" \
            --toolchain builder/toolchain.txt || true
          # `zpkb`/`zpkx` since the rename: `pkgx` is upstream's binary and
          # can be on the same PATH. See sovereign.yml.
          #
          # ⛔ ABOVE the command, never between its continued lines: a `#` line
          # there ends the continuation (actionlint SC2215, measured — see
          # sovereign.yml for the control).
          zpkb builder \
            --out "$RUNNER_TEMP/rootfs" \
            --platform "$MATRIX_PLATFORM" \
            --toolchain builder/toolchain.txt \
            --zpkb "$(command -v zpkb)" \
            --zpkx "$(command -v zpkx)" \
            --container

      # What the machine HAS, in a step of its own.
      #
      # It was written inside the build step first, which is a number nobody
      # can read for the three hours that step runs — and the whole reason it
      # exists is that llvm.org died with
      #   c++: fatal error: Killed signal terminated program cc1plus
      # and the log held no figure at all. A measurement you cannot see until
      # the end is barely a measurement.
      #
      # It also computes the job cap, because a heavy LLVM translation unit
      # wants on the order of 2 GB in cc1plus and the s390x lane asked for four
      # at once without ever checking there were eight. Computed here rather
      # than written per machine: a number written down is what is wrong the
      # day the VM is resized.
      - name: what this machine has
        run: |
          echo "disk:   $(df -h "$HOME" | tail -1)"
          if [ -r /proc/meminfo ]; then
            memkb=$(awk '/^MemTotal:/{print $2}' /proc/meminfo)
            avail=$(awk '/^MemAvailable:/{print int($2/1024)}' /proc/meminfo)
            # SWAP, because without it the cap below is the whole budget and a
            # single translation unit can exceed it. llvm.org 23.1.2 was
            # OOM-killed on the s390x seed at object 3880 of 7967, after 1h43,
            # on RISCVInstructionSelector.cpp -- with the cap ALREADY applied
            # (4 asked for, 3 used, 8009 MiB total). The log said "run: exit
            # status 1" and the census said nothing about swap, so whether
            # there was any to exceed took a trawl through 6000 lines to learn.
            swapkb=$(awk '/^SwapTotal:/{print $2}' /proc/meminfo)
            echo "memory: $((memkb/1024)) MiB total, $avail MiB available, $((swapkb/1024)) MiB swap"
            # A CONTAINER sees the host's /proc/meminfo, not its own limit, so
            # the GARM lanes would compute a cap for a machine they do not
            # have. The cgroup limit is the honest number when there is one;
            # v2 writes "max" when there is none.
            lim=""
            for f in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory/memory.limit_in_bytes; do
              if [ -r "$f" ]; then v=$(cat "$f"); case "$v" in [0-9]*) lim=$((v/1024));; esac; break; fi
            done
            if [ -n "$lim" ] && [ "$lim" -gt 0 ] && [ "$lim" -lt "$memkb" ]; then
              echo "cgroup: $((lim/1024)) MiB limit, below the $((memkb/1024)) MiB this host has"
              memkb=$lim
            fi
            cap=$(( memkb / 2097152 ))   # one job per 2 GiB
            # And never more jobs than CORES. Measured 2026-09-28: the s390x VM
            # has nproc=2 and 8009 MiB, so the memory cap alone said 3 and the
            # run compiled THREE llvm translation units on TWO cores -- each
            # wanting upwards of 2 GiB of a machine that has 7.8. The cap was
            # above the core count, so it capped nothing that mattered, and
            # min(2,3)=2 would have halved the peak for no loss of speed: two
            # cores do not run three compilers faster.
            cpus=$(nproc 2>/dev/null || echo 1)
            if [ "$cpus" -lt "$cap" ]; then
              echo "cores:  $cpus, below the $cap that memory allows"
              cap=$cpus
            fi
            # An `if`, not `[ ... ] && cap=1`. The mechanism is not `set -e`,
            # which leaves an AND-list alone: it is the SCRIPT'S EXIT STATUS.
            # A bare `[ false ] && x` as the last command executed makes the
            # script exit 1 and the step fail, wherever the shell got to.
            #
            #   bash -e -c 'cap=3; [ $cap -lt 1 ] && cap=1; echo hi'   -> hi, 0
            #   bash -e -c 'cap=3; [ $cap -lt 1 ] && cap=1'            -> 1
            #
            # This one has echoes after it, so it is harmless TODAY. An `if` is
            # harmless wherever it is moved to, which is the difference worth
            # having in a file people append to.
            if [ "$cap" -lt 1 ]; then cap=1; fi
            echo "cpus:   $(nproc 2>/dev/null || echo '?')"
            echo "MEM_JOBS=$cap" >> "$GITHUB_ENV"
            echo "memory fits $cap concurrent compile job(s)"
            if [ "$swapkb" -eq 0 ]; then
              echo "::warning::no swap: a compile that needs more than $((memkb/1024/cap)) MiB is an OOM kill, not a slow build"
            fi
          fi

          # WHAT IS HOLDING THE DISK, here and not in the post-mortem step.
          #
          # `disk and memory after` carries always() and prints exactly this,
          # and on 2026-09-28 it did not run: llvm.org filled the filesystem
          # during `ninja install`, the runner died writing its OWN diagnostic
          # log — `No space left on device: .../Worker_….log` — and always()
          # cannot save a step from a process that is gone. The inventory of
          # what fills the disk was therefore printed only on the runs where
          # the disk did not fill.
          #
          # zpkb removes a build tree once its artifact is PUBLISHED, so what
          # is here is what FAILED, kept on purpose. That day it was 4.2 GiB of
          # rust-lang.org from two earlier runs, against 13 GiB for the llvm
          # tree being built and 19 GiB free when the run started.
          #
          # ⛔ The root was `~/.local/share/brewkit` until zpkb v0.80.0 renamed
          # it. Both are reported, and that is not pkgx compatibility: these
          # runners are long-lived and OURS, so a tree a pre-v0.80.0 run left
          # behind still occupies the disk this step exists to measure. Drop
          # the second line once every runner has been cleaned once.
          root="$HOME/.local/share/zpkb"
          oldroot="$HOME/.local/share/brewkit"
          if [ -d "$oldroot" ]; then
            echo "build trees retained under the PRE-v0.80.0 root ($oldroot):"
            du -sh "$oldroot" 2>/dev/null || true
          fi
          if [ -d "$root" ]; then
            echo "build trees retained (zpkb keeps only what FAILED):"
            du -sm "$root"/*/*/ 2>/dev/null | sort -rn | head -10 |
              while read -r mb path; do printf '  %6s MiB  %s\n' "$mb" "${path#$root/}"; done
            biggest=$(du -sm "$root"/*/*/ 2>/dev/null | sort -rn | head -1 | cut -f1)
            freemb=$(df --output=avail -m "$HOME" | tail -1 | tr -d ' ')
            # Not an invented threshold: free space measured against the
            # largest tree already on disk. Below it, this machine cannot
            # afford to rebuild the biggest thing it has built.
            if [ -n "$biggest" ] && [ "$freemb" -lt "$biggest" ]; then
              echo "::warning::$freemb MiB free, and the largest retained build tree is $biggest MiB — this machine cannot afford another build that size"
            fi
          fi

      - name: build + publish this chunk
        env:
          PLATFORM: ${{ matrix.platform }}
          # ⛔ NO OCI_USERNAME EITHER: without its password it is a half credential,
          # which ghcr.io refuses (403) where an anonymous pull succeeds.
          # ⛔ NEITHER OCI_PASSWORD NOR SIGNING_KEY IS IN THIS STEP. It runs recipe
          # code — third-party shell — and anything in its environment is
          # readable by that code (go-zpkg/packages#440 context, secaudit
          # finding 2). It stages with `zpkb factory --stage-only`; the step
          # "sign and publish what the build staged" below holds the key and
          # the token and runs no recipe.
          #
          # GITHUB_TOKEN below is the workflow token with this job's
          # permissions, `contents: read`: it cannot write to the registry or to
          # the repository, so a recipe that reads it learns nothing it could
          # not fetch anonymously, only at a higher rate limit.
          # zpkb resolves a project's versions from api.github.com, and sends
          # `Authorization: Bearer $GITHUB_TOKEN` when it has one. Without it
          # the calls are ANONYMOUS — 60 requests an hour against a workflow
          # that resolves one project after another — and the run fails partway
          # through on something that is not a build problem at all:
          #
          #   curl.se 8.20 (darwin/aarch64) — build failed: resolve version:
          #     releases https://api.github.com/repos/curl/curl/releases: 403
          #     rate limit exceeded
          #
          # Measured 2026-09-04: a six-project repair run lost two of them this
          # way. The token the job already holds for the registry raises the
          # ceiling to 5000/hour; it just was never handed to the build.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLIBC: ${{ github.event.inputs.glibc }}
          MIRROR_FROM: ${{ github.event.inputs.mirror_from }}
          REQUIRE_ORIGIN: ${{ github.event.inputs.require_origin }}
          SOURCE_MIRROR: ${{ github.event.inputs.source_mirror }}
          # TRUST FOR THE SOURCE ONLY: the validated key list, passed below as
          # `--source-trust` to the one command that verifies the source. It is
          # deliberately NOT ZPKG_EXTRA_TRUSTED_KEYS, so no install, test or
          # catalogue step in this job believes it, and the publish job is never
          # handed it (it reads --publish-env, which does not carry SOURCE_KEYS).
          SOURCE_KEYS: ${{ env.SOURCE_KEYS }}
          # The overlay is what zpkb's `--overrides` does for the recipes zpkb READS,
          # but for the recipes PKGX reads while materialising a build's
          # dependency environment. Without it, a dependency whose upstream recipe
          # still pins `openssl.org: ^1.1` stops the build with "no version of
          # openssl.org satisfies ^1.1" — which is exactly how
          # github.com/containers/crun died, through python.org, on a runner
          # where every other correction WAS applied.
          ZPKG_RECIPES_OVERLAY: ${{ env.OVERLAY_URL }}
          ZPKG_EXTRA_TRUSTED_KEYS: ${{ env.EXTRA_KEYS }}
          VERSIONS: ${{ github.event.inputs.versions }}
          BOOTSTRAP: ${{ github.event.inputs.bootstrap }}
          # A VARIABLE zpkb reads through envBool, never
          # ${TEST_ONLY:+--test-only} on the command line below: `:+` tests
          # for non-empty and "0" is not empty, so that form turns the flag
          # ON when a dispatch said off. envBool exists because FORCE=0 had
          # to mean off (go-zpkg/zpkb#251), and this joins FORCE, NO_CLOSURE
          # and PIN_TO_DEPENDENTS in reading it that way.
          TEST_ONLY: ${{ github.event.inputs.test_only }}
          JOBS: ${{ matrix.jobs }}
          QEMU_RESERVED_VA: ${{ matrix.qemu_va }}
          # Read by the script below as environment, never interpolated into
          # its text (they were checked by `inputcheck` before this job built).
          MATRIX_CHUNK: ${{ matrix.chunk }}
          IN_LOCK: ${{ github.event.inputs.lock }}
          IN_RECIPES: ${{ github.event.inputs.recipes }}
          IN_FORCE: ${{ github.event.inputs.force }}
          IN_CLEAN_BUILD_ROOT: ${{ github.event.inputs.clean_build_root }}
          IN_MAX_VERSIONS: ${{ github.event.inputs.max_versions }}
          IN_NO_CLOSURE: ${{ github.event.inputs.no_closure }}
          IN_PIN_TO_DEPENDENTS: ${{ github.event.inputs.pin_to_dependents }}
          IN_REBUILD: ${{ github.event.inputs.rebuild }}
        run: |
          FORCE=""
          # A LOCK wins over every other way of naming the set, and is passed
          # to zpkb as a FILE rather than expanded here: zpkb reads it, and a
          # second expansion in shell would be a second answer to the same
          # question. See `zpkb factory --lock`.
          # Named = the dispatcher said what to build: a lock, recipes, or a
          # mirror_from promotion. Only the nightly's numeric chunks are
          # best-effort. zpkb reads STRICT from the environment (zpkb#544).
          NAMED_DISPATCH=0
          if [ -n "$IN_LOCK" ] || [ "$MATRIX_CHUNK" = "manual" ] || [ -n "$MIRROR_FROM" ] || [ -n "$REQUIRE_ORIGIN" ]; then
            NAMED_DISPATCH=1
            export STRICT=1
          fi
          if [ -n "$IN_LOCK" ]; then
            LOCK="$IN_LOCK"
            [ -r "$LOCK" ] || { echo "::error::no lock at $LOCK in this repository"; exit 1; }
            echo "locked build from $LOCK ($(grep -c '= { version' "$LOCK") pin(s))"
          elif [ "$MATRIX_CHUNK" = "manual" ]; then
            RECIPES="$IN_RECIPES"
            # A manual dispatch rebuilds what it names by default — that is what
            # refreshing a stale artifact is. `force: 0` turns the same list into
            # "build what is MISSING from this", which is the question a
            # bootstrap pass asks every time: a seed of 76 projects is grown a
            # few at a time and nothing on the outside knows which of them the
            # seed registry already holds. Without this the only way to ask was
            # to reconstruct the answer from the previous runs' logs, and a
            # count read off a log is a count of what the log happened to print.
            [ "$IN_FORCE" = "0" ] || FORCE=1
          else
            start=$(( MATRIX_CHUNK * CHUNK + 1 )); end=$(( start + CHUNK - 1 ))
            RECIPES="$(grep -vE '^[[:space:]]*(#|$)' recipes.txt | sed -n "${start},${end}p" | tr '\n' ' ')"
          fi
          # shellcheck disable=SC2086  # RECIPES is intentionally word-split to count projects
          echo "chunk $MATRIX_CHUNK →$(printf '%s\n' $RECIPES | grep -c .) requested projects${FORCE:+ (FORCE rebuild)}"
          # RECIPES / FORCE / MAX_VERSIONS / PLATFORM / LOCK are read from the
          # env by `zpkb factory` itself; the rest is passed explicitly.
          # Disk, before and after, because a full one does not announce
          # itself — it arrives as somebody else's error. The s390x seed hit
          # it on the fifty-seventh project and reported
          #   kernel.org/linux-headers: fetch: write …: no space left on device
          # naming a project that had done nothing wrong. zpkb now removes a
          # published build tree (go-zpkg/zpkb#217); what a run INHERITS from
          # earlier ones it cannot remove, and only a number shows that.
          if [ -n "$IN_CLEAN_BUILD_ROOT" ]; then
            echo "clearing the build root a previous run left behind:"
            # BOTH roots: zpkb's own, and the pre-v0.80.0 `brewkit` spelling,
            # which these long-lived runners still hold and which repointing
            # the lane would otherwise make unreclaimable.
            du -sh "$HOME/.local/share/zpkb" "$HOME/.local/share/brewkit" 2>/dev/null || true
            rm -rf "$HOME/.local/share/zpkb" "$HOME/.local/share/brewkit"
          fi
          echo "disk before:"; df -h "$HOME" | tail -1
          # The cap this run will use was computed and printed by the step
          # above, which finishes in a second so the number is readable while
          # this one runs for hours.
          if [ -z "$JOBS" ] && [ -n "$MEM_JOBS" ]; then
            # The lane asked the MACHINE. "Computed here rather than written
            # per machine: a number written down is what is wrong the day the
            # VM is resized" — the census step says that about the cap, and the
            # lane's own number was written down anyway. The s390x VM was
            # resized twice in one day: 4 was written for it, the machine had
            # 2 cores, and the replacement has 8.
            echo "jobs: none asked for, $MEM_JOBS fits this machine — using $MEM_JOBS"
            JOBS="$MEM_JOBS"
            export JOBS
          elif [ -n "$MEM_JOBS" ] && [ -n "$JOBS" ] && [ "$JOBS" -gt "$MEM_JOBS" ]; then
            echo "jobs: $JOBS asked for, $MEM_JOBS fits in memory — using $MEM_JOBS"
            JOBS="$MEM_JOBS"
            export JOBS
          fi
          du -sh "$HOME/.local/share/zpkb" "$HOME/.local/share/brewkit" 2>/dev/null || echo "  (no build root yet)"
          MAX_VERSIONS="$IN_MAX_VERSIONS"
          NO_CLOSURE="$IN_NO_CLOSURE"
          PIN_TO_DEPENDENTS="$IN_PIN_TO_DEPENDENTS"
          # REBUILD is NOT derived from FORCE: a manual dispatch forces by
          # default, so deriving it would mint a `_N` on every retry of a lane
          # that failed at the publish step. Asked for explicitly or not at all.
          REBUILD="$IN_REBUILD"
          export RECIPES FORCE MAX_VERSIONS NO_CLOSURE PIN_TO_DEPENDENTS LOCK REBUILD
          # A glibc-pinned build links the pkgx glibc artifact directly, which bakes
          # an ABSOLUTE PT_INTERP pointing into $ZPKG_DIR. Under the default
          # ($HOME/.pkgx) that is the RUNNER's home — a path no consumer has, so
          # the artifact could only start through an explicit loader invocation.
          # Build such artifacts under the canonical /zpkg prefix instead: the same
          # one `pkgm image` bakes into a from-scratch image, so the interpreter
          # resolves where the package is actually installed.
          # (an `if`, not `[ … ] &&`. Not because of `set -e`, which leaves an
          # AND-list alone, but because a bare `[ false ] && x` as the LAST
          # command executed sets the script's exit status to 1 and fails the
          # step. An `if` is harmless wherever it is moved to.)
          if [ -n "$GLIBC" ]; then export ZPKG_DIR=/zpkg; fi
          # Sovereign by default. The two arches are proven — lz4.org built in
          # the staged rootfs on x86-64 and on the EMULATED aarch64 pool, the
          # artifacts carrying PT_INTERP into /zpkg and no distribution strings at
          # all — and the pull-through cache makes staging affordable. `0` is the
          # way back to the runner's distribution.
          #
          # Mirroring compiles nothing, so it never wants a toolchain staged.
          if [ "$SOVEREIGN_ON" = 1 ]; then
            # One shared script, not a copy: every line of it is there because
            # its absence was measured, and two divergent copies of that is how
            # one of them silently stops being sovereign.
            # A chunk is best-effort by design, so it must NOT fail on "0 built".
            export ZPKG_DIR=/zpkg HOME=/root
            # A chunk is best-effort: the tally and the failure artifacts are
            # the result, and a recipe that genuinely does not build must not
            # paint the whole lot red. The proof job keeps the strict posture.
            # A dispatch that NAMES what it wants (recipes, a lock, mirror_from)
            # is the opposite: any failure fails the job (promo-r1).
            if [ "$NAMED_DISPATCH" = 1 ]; then
              export SOVEREIGN_STRICT=1
            else
              export SOVEREIGN_STRICT=0
            fi
            SOVEREIGN_OVERLAY="$PWD/overlay" \
            SOVEREIGN_ADVISORIES="$PWD/advisories" \
            builder/sovereign-build.sh \
              "$RUNNER_TEMP/rootfs" "$PWD/pantry" "$PWD/overrides" \
              ${GLIBC:+--glibc "$GLIBC"} \
              ${VERSIONS:+--versions "$VERSIONS"}
            # zpkb runs with the chroot's root as its CWD, so everything it
            # writes lands in the rootfs and not in the workspace the upload
            # steps read. Without this the failure lists are LOST: a lot that
            # fails a dozen recipes uploads no artifacts at all, and the only
            # remaining trace is the job log — which is exactly the evidence a
            # campaign needs to tell a broken recipe from a broken factory.
            cp -r "$RUNNER_TEMP/rootfs/dist" dist 2>/dev/null || true
            # tests.txt joins them: go-zpkg/zpkb#248 has the factory record
            # each published package's own test: block, and a record written
            # inside the rootfs is a record nobody reads.
            for f in failures.txt failures-detail.txt tests.txt; do
              cp "$RUNNER_TEMP/rootfs/$f" "$f" 2>/dev/null || true
            done
          else
            # --to follows ZPKG_DIST rather than naming ghcr again: the two
            # must not be able to disagree, and a seed pass that READ a
            # throwaway registry while PUBLISHING to the real one is exactly
            # the accident this lane exists to make impossible.
            # --advisories: each published artifact carries an OpenVEX document
            # saying which vulnerabilities were considered and what was decided.
            # Validated ONCE before the first build — a record that does not
            # parse stops a publish, and the fortieth artifact of a chunk is six
            # hours into the run.
            # Always --stage-only: this job holds no key and no token that can
            # push. With mirror_from it fetches and verifies the seed artifacts
            # and stages them (go-zpkg/packages#500); inputcheck guarantees
            # require_origin is set then, which zpkb requires of a staged mirror.
            zpkb factory --stage-only \
              --recipe-dir pantry \
              --overrides overrides \
              --overlay overlay \
              --advisories advisories \
              --to "${PUBLISH_TO:-oci://test-only.invalid/none}" \
              --artifacts dist \
              ${BOOTSTRAP:+--bootstrap} \
              ${GLIBC:+--glibc "$GLIBC"} \
              ${VERSIONS:+--versions "$VERSIONS"} \
              ${MIRROR_FROM:+--mirror-from "$MIRROR_FROM"} \
              ${REQUIRE_ORIGIN:+--require-origin} \
              ${SOURCE_KEYS:+--source-trust "$SOURCE_KEYS"} \
            ${SOURCE_MIRROR:+--source-mirror "$SOURCE_MIRROR"}
          fi

      # Declares what the build staged, for the `publish` job: the publish lane
      # (inputcheck decided it from the destination) and, when a plan was
      # written, the sha256 digest of the staged tree. `publish` refuses unless
      # the tree it downloads has exactly this digest. `always()` so what a
      # partly failed build staged is still published; a build that wrote no plan
      # has nothing to publish and declares no digest.
      - name: digest what the build staged
        id: digest
        if: always()
        run: |
          set -eu
          echo "lane=${PUBLISH_LANE:-}" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/declare"
          echo none > "$RUNNER_TEMP/declare/digest.txt"
          if [ "${SOVEREIGN_ON:-}" = 1 ]; then
            stage="$RUNNER_TEMP/rootfs/dist"
          else
            stage=dist
          fi
          if [ ! -f "$stage/publish-plan.json" ]; then
            echo "nothing staged: no publish-plan.json in $stage"
            exit 0
          fi
          # The chroot's root wrote these; the digest and the upload must read them.
          sudo chmod -R a+rX "$stage" 2>/dev/null || chmod -R a+rX "$stage"
          digest=$(go run ./distdigest "$stage")
          echo "STAGE_DIR=$stage" >> "$GITHUB_ENV"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$digest" > "$RUNNER_TEMP/declare/digest.txt"
          echo "staged tree $digest (lane ${PUBLISH_LANE:-none})"

      - name: declare the digest for the publish job
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: declare-${{ matrix.slug }}-${{ matrix.chunk }}
          path: ${{ runner.temp }}/declare/digest.txt
          if-no-files-found: ignore

      - name: upload the staged tree for publishing
        if: always() && steps.digest.outputs.digest != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: publish-${{ matrix.slug }}-${{ matrix.chunk }}
          path: ${{ env.STAGE_DIR }}
          if-no-files-found: error

      # The smoke registry (oci://http://10.46.81.1:5111) and a loopback seed
      # registry are not reachable from a GitHub-hosted runner, so those two keep
      # a path that needs no secret: this job pushes UNAUTHENTICATED and
      # UNSIGNED. Nothing signed is ever produced on this lane.
      - name: publish to a LAN or loopback registry, unsigned and unauthenticated
        id: lan_publish
        if: always() && env.PUBLISH_LANE == 'lan' && steps.digest.outputs.digest != ''
        env:
          PLATFORM: ${{ matrix.platform }}
          ZPKG_EXTRA_TRUSTED_KEYS: ${{ env.EXTRA_KEYS }}
        run: |
          zpkb publish-stage "$STAGE_DIR" --to "${PUBLISH_TO:?publishing requires an explicit destination}" --advisories "$PWD/advisories" --allow-unsigned

      # A NAMED dispatch that built nothing is a failed dispatch.
      #
      # A chunk of fifty is best-effort on purpose: one recipe that genuinely
      # does not build must not paint the whole lot red. That reasoning does
      # not reach a dispatch that names its recipes and produces no artifact at
      # all — there the green tick says the opposite of what happened.
      #
      # Measured on 2026-10-04: `recipes=kernel.org/linux-headers
      # versions==7.2.8` ended
      #   ❌ BUILD FAIL kernel.org/linux-headers 7.2.8: run: exit status 127
      #   === summary (linux/x86-64): 0 built, 0 skipped, 1 failed ===
      # and the job was GREEN. The next step was to merge a toolchain pin that
      # depended on that artifact existing.
      #
      # Deliberately narrow: 0 built AND something failed. A named dispatch
      # where some built and some failed keeps the best-effort posture, and
      # one that built nothing because there was nothing to build (force=0,
      # already published) has no failure and stays green.
      # NOT always(): if the build step itself failed the job is already red,
      # and a second error under it only competes with the first. Both the
      # sovereign path (SOVEREIGN_STRICT=0 for a chunk) and `zpkb factory`
      # exit 0 on a recipe failure, which is exactly the case this catches.
      #
      # REVISED after promo-r1 (run 45140545009): `0 built, 0 skipped, 1 failed`
      # and `stage plan: 0 artifact(s)` ended GREEN, because
      #  - this step counted FILES in dist, and publish-plan.json is one, so
      #    "built" was never 0;
      #  - it ran for `recipes` only, not for a lock or a mirror_from; and
      #  - the sovereign path stages in $RUNNER_TEMP/rootfs/dist, not dist.
      # Now ANY failure fails a named dispatch (recipes, lock, mirror_from or
      # require_origin), and a promotion that stages no artifact fails too.
      # The nightly's chunks (blank recipes) keep their best-effort posture:
      # none of this runs for them. The decision is `namedcheck`, a Go program
      # with a test, not shell.
      - name: a named dispatch that built nothing
        if: github.event.inputs.recipes != '' || github.event.inputs.lock != '' || github.event.inputs.mirror_from != '' || github.event.inputs.require_origin != ''
        env:
          IN_MIRROR_FROM: ${{ github.event.inputs.mirror_from }}
          IN_REQUIRE_ORIGIN: ${{ github.event.inputs.require_origin }}
        run: |
          set -eu
          if [ "${SOVEREIGN_ON:-}" = 1 ]; then
            stage="$RUNNER_TEMP/rootfs/dist"
          else
            stage=dist
          fi
          promo=
          if [ -n "$IN_MIRROR_FROM" ] || [ -n "$IN_REQUIRE_ORIGIN" ]; then promo=--require-staged; fi
          go run ./namedcheck --failures failures.txt --stage "$stage" $promo

      # The CATALOGUE: what `pkgs ls` and <TAB> read.
      #
      # It exists because a registry cannot be enumerated. Measured against
      # ghcr: /v2/_catalog answers 403 to an anonymous client and only a
      # project's own tag list is served, so nothing can ask "what packages
      # are there" (go-zpkg/artifact#114). The answer is an artefact in the
      # registry, published as an ordinary artifact.
      #
      # ONE CHUNK, not every chunk. It is derived from the PANTRY, not from
      # what this job built, so all 38 chunks of a nightly would push the
      # same bytes. Chunk 0 and a named dispatch each publish it once.
      #
      # ⛔ ONLY WHEN THIS RUN PUBLISHED SOMETHING, AND NEVER AFTER A FAILED
      # STEP. This used to be always(), on the reasoning that a catalogue
      # describes what the pantry NAMES. It pushed an UNSIGNED catalogue of 2057
      # projects into promo-r2 (run 45147362828) after the build step had failed
      # and nothing had been published: a registry's catalogue then listed names
      # that the registry did not carry. `success()` refuses a run in which any
      # step failed, and the LAN publish step's own outcome refuses a run that
      # published nothing (no plan staged, or a lane that is not this one).
      #
      # It follows ZPKG_DIST like everything else here, so a seed run writes
      # its catalogue into the seed registry and not into the real one.
      #
      # --overrides, because an override changes a recipe's DEPENDENCIES and
      # the catalogue now carries them. Without it the published tree
      # describes a factory that is not this one: the reader would be shown
      # the upstream recipe's edges while every artifact beside them was built
      # from the corrected ones.
      #
      # --versions, which is ~1900 requests. That is the price of being able
      # to say "this exists but has no artifact for your platform" instead of
      # listing a name with nothing beside it, and it is paid HERE — once, in
      # CI, on one chunk — rather than on the machine of everyone who presses
      # <TAB>. It is also why the catalogue is per-platform: the s390x lane
      # has a fraction of what linux/x86-64 has, and one list would tell most
      # readers that packages are available which, for them, are not.
      #
      # SIGNING_KEY, because a client with ZPKG_VERIFY on — the default —
      # refuses an unsigned catalogue (go-zpkg/artifact#118). The catalogue is
      # the list of names a person then TYPES, so whoever decides its
      # contents decides what <TAB> offers; it gets the same signature as any
      # other artifact. A seed run has no key and says so in its own output.
      - name: publish the catalogue
        # A test_only run has no destination (PUBLISH_TO is blank) and publishes
        # no catalogue either: it never falls back to the registry it read.
        #
        # ⛔ THIS COPY IS THE LAN/LOOPBACK LANE ONLY: unsigned, no credential. A
        # catalogue for a hosted destination is signed and pushed by the
        # `publish` job, which holds the key and runs no recipe.
        if: success() && steps.lan_publish.outcome == 'success' && (matrix.chunk == '0' || matrix.chunk == 'manual') && env.PUBLISH_TO != '' && env.PUBLISH_LANE == 'lan'
        env:
          PLATFORM: ${{ matrix.platform }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # zpkb catalog --publish pushes to $ZPKG_DIST: an oci_to run must
          # catalogue where it published, not where it read.
          ZPKG_DIST: ${{ env.PUBLISH_TO }}
          ZPKG_EXTRA_TRUSTED_KEYS: ${{ env.EXTRA_KEYS }}
        run: |
          set -eu
          zpkb catalog \
            --recipe-dir pantry \
            --overlay overlay \
            --overrides overrides \
            --versions \
            --platform "$PLATFORM" \
            --publish

      # AFTER, and `always()`, because the number matters most on the run
      # that just failed. A step that only reports on success reports the
      # disk of every run except the one that filled it.
      - name: disk and memory after
        if: always()
        run: |
          df -h "$HOME" | tail -1
          # Memory too, and `always()` matters more here than for disk: a run
          # the OOM killer ended reports nothing about memory unless the step
          # runs on failure. llvm.org died at 4297 of 7967 objects with
          # "Killed signal terminated program cc1plus" and took the runner with
          # it, and the log held no number at all.
          # An `if`, not `[ … ] &&`. The note this replaces blamed `set -e`,
          # which is wrong and sent me looking for a landmine that was not
          # there: `set -e` leaves an AND-list alone. What bites is the
          # SCRIPT'S EXIT STATUS — a bare `[ false ] && x` as the LAST command
          # executed makes the step fail. An `if` is harmless wherever it lands.
          if [ -r /proc/meminfo ]; then
            awk '/^Mem(Total|Available):/{printf "%s %d MiB\n", $1, $2/1024}' /proc/meminfo
          fi
          du -sh "$HOME/.local/share/zpkb" "$HOME/.local/share/brewkit" 2>/dev/null || echo "  (no build root)"
          # The ten biggest directories left behind, at ANY depth. zpkb
          # removes a tree once its artifact is PUBLISHED (go-zpkg/zpkb#217),
          # so what remains is what FAILED — kept on purpose, and worth
          # seeing the size of.
          #
          # No glob: a project name carries a variable number of slashes
          # (zlib.net against x.org/protocol/xcb), so a fixed `*/*/*`
          # would compare a project directory against a version one.
          #
          # The pre-v0.80.0 `brewkit` root is listed beside it for as long as
          # these runners still hold trees from before the rename.
          du -h "$HOME/.local/share/zpkb" "$HOME/.local/share/brewkit" 2>/dev/null | sort -rh | head -10 || true

      # What a SEED generation was made of.
      #
      # Nix keeps its bootstrap-tools as a committed, versioned artefact, so
      # anyone can say what the first generation on a platform was built from.
      # Ours is deliberately ephemeral — it lives in a throwaway loopback
      # registry and is thrown away once the sovereign rebuild replaces it —
      # which is defensible, and leaves the second generation unable to name
      # its parent.
      #
      # So record the parent instead of keeping it: the host tools that stood
      # in for artifacts, and the state of the seed registry when the run ended.
      # Without this the only trace of WHICH gcc compiled the first s390x
      # toolchain is a runner that will be reimaged.
      # EVERY run, not only a bootstrap. The gate was `bootstrap == '1'`
      # because the host-tool census was written for a seed generation — and
      # it took the "== the inputs that were not pinned ==" block with it,
      # which is the part that is about ANY run.
      #
      # Found by needing it: a --test-only sweep chased the same question
      # twice — which zpkb did this run install? — and the only trace was the
      # module cache's tar warnings, which name whatever versions are on
      # disk rather than the one that ran.
      #
      # The census stays for every run too. `command -v` twenty times and a
      # catalogue listing cost nothing next to a build, and a run that used
      # the host's gcc is worth recording whether or not it was the first.
      - name: record what this run read
        if: always()
        env:
          SEED_DIST: ${{ github.event.inputs.seed_dist }}
        run: |
          : > seed-provenance.txt
          {
            # The file keeps its name. It is written for every run now, not
            # only a seed's, and renaming it would break whatever anybody has
            # pointed at `seed-provenance-*` — so the correction goes in the
            # first line, where a reader meets it.
            echo "run provenance (any run; the name is historical) — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "platform:  ${PLATFORM:-?}"
            echo "runner:    $(uname -srm)"
            echo "distro:    $(. /etc/os-release 2>/dev/null && echo "$PRETTY_NAME" || echo unknown)"
            echo
            # The commit above this file is only ONE of the run's inputs. The
            # pantry and the overlay are cloned --depth 1 from a moving branch
            # and zpkb is installed @main, so three of the four inputs to a build
            # were, until this block, decided at run time and written nowhere.
            #
            # On 2026-09-29 two runs an hour apart at the SAME packages commit
            # disagreed about whether an override applied. Answering "did the
            # pantry move?" meant querying GitHub's API afterwards — which
            # worked only because the history was short and public, and would
            # not have worked at all a month later. A run has to be able to say
            # what it read.
            #
            # An input that cannot be read is recorded as unread, never as
            # absent: "(unread)" is a different claim from a repository that
            # was not cloned, and a reader must not have to guess which.
            echo "== the inputs that were not pinned =="
            printf '%-10s %s\n' packages "${GITHUB_SHA:-(unread)}"
            for d in pantry overlay; do
              if [ -d "$d/.git" ]; then
                printf '%-10s %s\n' "$d" "$(git -C "$d" rev-parse HEAD 2>/dev/null || echo '(unread)')"
              else
                printf '%-10s %s\n' "$d" "(not cloned)"
              fi
            done
            # go version -m reads the module version STAMPED INTO the binary,
            # which is the one thing here that cannot drift from what ran.
            #
            # Taken through a variable rather than inlined in the printf: a
            # binary that is there but carries no stamp makes the pipeline
            # print NOTHING and succeed, and an empty field beside a label
            # reads as an answer. Ask whether it is empty, and say so.
            # ⛔ `zpkb`, AND THE MODULE FILTER BELOW IS WHY IT MATTERS HERE.
            # The lookup was `command -v zpkb`; the binary is `zpkb` since the
            # rename. Left as `zpkb` it finds nothing, prints `(unread)`, and
            # this provenance record silently stops saying which factory built
            # the run — the exact failure the comment above is about.
            bkver=""
            bkbin=$(command -v zpkb 2>/dev/null || true)
            if [ -n "$bkbin" ]; then
              bkver=$(go version -m "$bkbin" 2>/dev/null |
                awk '$1=="mod" && $2=="github.com/go-zpkg/zpkb" {print $3}')
            fi
            printf '%-10s %s\n' zpkb "${bkver:-(unread)}"
            echo
            echo "== host tools that stood in for artifacts =="
            # Each of these can be what --bootstrap fell back to. Recording the
            # whole set rather than the ones this chunk happened to use: the
            # seed is one generation, not one chunk.
            for t in gcc g++ cc ld ar make m4 perl curl awk sed grep bison flex pkg-config autoconf automake libtool python3; do
              p=$(command -v "$t" 2>/dev/null) || { printf '%-12s absent\n' "$t"; continue; }
              v=$("$t" --version 2>/dev/null | head -1)
              printf '%-12s %s  %s\n' "$t" "$p" "${v:-(no --version)}"
            done
            echo
            # Repositories AND the versions in them.
            #
            # The catalog alone answers "is x.org/x11 in the seed", and the
            # question that actually comes up is "which x11". tcl-lang.org
            # declares `x.org/x11: =1.8.11` as a LINK dependency, the seed has
            # 1.8.13, and a listing of repository names cannot tell you that —
            # I read this file looking for exactly that and it was not here.
            #
            # A registry with no tags for a repository still prints the
            # repository, because "present with no version" is a state worth
            # seeing rather than a row to drop.
            echo "== seed registry contents =="
            if [ -n "$SEED_DIST" ]; then
              base=${SEED_DIST#oci://}
              host=${base%%/*}
              if repos=$(curl -fsS -m 20 "http://$host/v2/_catalog" 2>/dev/null); then
                echo "$repos" | tr ',' '\n' | sed -n 's/.*"\([^"]*\)".*/\1/p' | grep -vx repositories | sort -u |
                while read -r r; do
                  [ -n "$r" ] || continue
                  tags=$(curl -fsS -m 20 "http://$host/v2/$r/tags/list" 2>/dev/null |
                         tr ',' '\n' | sed -n 's/.*"\([0-9][^"]*\)".*/\1/p' |
                         grep -v -- '--' | sort -Vu | tr '\n' ' ')
                  printf '%-44s %s\n' "$r" "${tags:-(no version tag)}"
                done
              else
                echo "(catalog unreadable)"
              fi
              # Does this registry hold SIGNATURES at all?
              #
              # The second generation died staging its rootfs on "zlib.net
              # v1.3.2 (linux/s390x) is unsigned (no signature referrer)",
              # and the seed run HAS $SIGNING_KEY — zpkb signs whenever it is
              # set. So either the registry cannot store a referrer or the
              # push fails quietly, and nothing on the runner said which.
              #
              # One probe, on one real artifact, so the next run answers it for
              # free instead of leaving a note that says "unknown". A 404 or
              # an empty manifest list is the registry saying it does not
              # serve the Referrers API; an index with entries means the
              # signature IS there and the verifier is looking elsewhere.
              echo "-- referrers API --"
              probe=$(echo "$repos" | tr ',' '\n' | sed -n 's/.*"\([^"]*\)".*/\1/p' |
                      grep -vx repositories | sort -u | head -1)
              if [ -n "$probe" ]; then
                tag=$(curl -fsS -m 20 "http://$host/v2/$probe/tags/list" 2>/dev/null |
                      tr ',' '\n' | sed -n 's/.*"\([0-9][^"]*\)".*/\1/p' |
                      grep -v -- '--' | sort -Vu | tail -1)
                dig=$(curl -fsS -m 20 -o /dev/null -D- \
                        -H 'Accept: application/vnd.oci.image.index.v1+json' \
                        -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
                        "http://$host/v2/$probe/manifests/$tag" 2>/dev/null |
                      tr -d '\r' | sed -n 's/^[Dd]ocker-[Cc]ontent-[Dd]igest: *//p')
                if [ -n "$dig" ]; then
                  # NO -f: this probe WANTS the status, and -f makes curl
                  # exit non-zero on a 404 — so `%{http_code}` and the `|| echo
                  # 000` fallback both wrote and the first run reported
                  # "HTTP 404000". Readable by luck, because 404 is
                  # unmistakable; a 200 would have come out "200000".
                  code=$(curl -sS -m 20 -o /tmp/ref.json -w '%{http_code}' \
                           "http://$host/v2/$probe/referrers/$dig" 2>/dev/null || echo 000)
                  n=$(tr ',' '\n' < /tmp/ref.json 2>/dev/null | grep -c artifactType || true)
                  echo "$probe@$tag -> HTTP $code, $n referrer(s)"
                else
                  echo "$probe: no content digest for tag ${tag:-(none)}"
                fi
              else
                echo "(no repository to probe)"
              fi
            else
              echo "(no seed_dist)"
            fi
            echo
          } >> seed-provenance.txt
          cat seed-provenance.txt

      # (The step that scrubbed the signing key and the registry token out of the
      # uploaded records is gone with them: this job holds neither, so there is
      # nothing to find. The read-only GITHUB_TOKEN is masked in the log like any
      # other and expires with the job.)

      - name: upload seed provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: seed-provenance-${{ matrix.slug }}-${{ matrix.chunk }}
          path: seed-provenance.txt
          if-no-files-found: ignore

      # The pkgx dist tree `zpkb factory --artifacts dist` writes — unioned into
      # the GitHub Pages mirror by pages.yml. Named per arch+chunk so pages.yml
      # discovers every slice (it globs dist-*).
      - name: upload dist tree
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-${{ matrix.slug }}-${{ matrix.chunk }}
          path: dist
          if-no-files-found: ignore

      - name: upload failures list
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: failures-${{ matrix.slug }}-${{ matrix.chunk }}
          path: failures.txt
          if-no-files-found: ignore

      # Per-recipe error tails, so build failures are diagnosable from the
      # artifact alone (container-job logs are not retrievable via the API).
      - name: upload failure details
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: failures-detail-${{ matrix.slug }}-${{ matrix.chunk }}
          path: failures-detail.txt
          if-no-files-found: ignore

      # What each published package's OWN test: block said — four states, one
      # line each (go-zpkg/zpkb#248). Separate from failures.txt on purpose: a
      # failing test is not a failing build, and the factory's exit status is
      # untouched by it. Of 12 test failures measured over 120 packages only 2
      # were an artifact nobody can run, which is why this is a record and not a
      # gate.
      - name: upload the test record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tests-${{ matrix.slug }}-${{ matrix.chunk }}
          path: tests.txt
          if-no-files-found: ignore

  # ⛔ THE ONLY JOB HERE THAT HOLDS THE SIGNING KEY AND A TOKEN THAT CAN WRITE,
  # and it runs no recipe. One leg per build leg, on an ephemeral GitHub-hosted
  # runner: it downloads the tree the build leg staged, REFUSES unless that
  # tree's sha256 digest equals the one the build leg declared as its job
  # output, then `zpkb publish-stage` re-checks every file against the plan and
  # signs and pushes exactly what `zpkb factory --to` would have. Actions are
  # pinned by SHA here, since this is the job a compromised action would own.
  #
  # `always()`: what a partly failed build staged is still published. A leg
  # whose build declared no lane never started its steps and is skipped.
  # A destination the hosted runner cannot reach (the smoke registry, a
  # loopback seed registry) is the `lan` lane, published from the build job
  # itself without a credential, and is skipped here.
  publish:
    needs: [preflight, setup, build]
    # `matrix` is not available in a job-level `if`: the per-leg condition is
    # DECLARED_DIGEST != 'none', tested by the steps below.
    if: always() && needs.setup.result == 'success' && needs.preflight.outputs.lane == 'hosted'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version: '1.27.4' }

      # The build leg's declaration. A missing one is a failure, never a skip:
      # only an explicit `none`, written by a leg that staged nothing, skips.
      - name: download the build job's declaration
        id: declared
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: declare-${{ matrix.slug }}-${{ matrix.chunk }}
          path: ${{ runner.temp }}/declare

      # The file is the self-hosted job's: distdigest accepts `none` or one
      # sha256 line and nothing else, so what reaches the environment is a value.
      - name: read the declared digest
        run: |
          set -eu
          d=$(go run ./distdigest --declared "$RUNNER_TEMP/declare/digest.txt")
          echo "DECLARED_DIGEST=$d" >> "$GITHUB_ENV"
          if [ "$d" = none ]; then
            echo "the build leg declared none: nothing staged, publishing skipped"
          fi

      # The same validation the build job ran, from the same inputs, so the two
      # cannot disagree; it also settles PUBLISH_TO and SIGN_PROD for this job.
      # Here the key's presence IS read: a go-zpkg destination without it fails.
      - name: validate the dispatch inputs and export them
        if: env.DECLARED_DIGEST != 'none'
        env:
          IN_OCI_TO: ${{ github.event.inputs.oci_to }}
          IN_DIST_FROM: ${{ github.event.inputs.dist_from }}
          IN_OVERLAY_REF: ${{ github.event.inputs.overlay_ref }}
          IN_SEED_DIST: ${{ github.event.inputs.seed_dist }}
          IN_REQUIRE_ORIGIN: ${{ github.event.inputs.require_origin }}
          IN_MIRROR_FROM: ${{ github.event.inputs.mirror_from }}
          IN_SOURCE_MIRROR: ${{ github.event.inputs.source_mirror }}
          IN_GLIBC: ${{ github.event.inputs.glibc }}
          IN_VERSIONS: ${{ github.event.inputs.versions }}
          IN_EXTRA_KEYS: ${{ github.event.inputs.extra_trusted_keys }}
          IN_LOCK: ${{ github.event.inputs.lock }}
          IN_RECIPES: ${{ github.event.inputs.recipes }}
          IN_MAX_VERSIONS: ${{ github.event.inputs.max_versions }}
          IN_FORCE: ${{ github.event.inputs.force }}
          IN_REBUILD: ${{ github.event.inputs.rebuild }}
          IN_NO_CLOSURE: ${{ github.event.inputs.no_closure }}
          IN_PIN_TO_DEPENDENTS: ${{ github.event.inputs.pin_to_dependents }}
          IN_CLEAN_BUILD_ROOT: ${{ github.event.inputs.clean_build_root }}
          IN_BOOTSTRAP: ${{ github.event.inputs.bootstrap }}
          IN_TEST_ONLY: ${{ github.event.inputs.test_only }}
          IN_SOVEREIGN: ${{ github.event.inputs.sovereign }}
          HAVE_ZPKG_KEY: ${{ secrets.ZPKG_SIGNING_KEY != '' }}
        # --publish-env: this job builds nothing, so it is not handed the build's
        # OVERLAY_URL, DIST_FROM or SEED_* (publish-stage reads none of them).
        run: go run ./inputcheck --publish-env

      - name: download the staged tree
        if: env.DECLARED_DIGEST != 'none'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: publish-${{ matrix.slug }}-${{ matrix.chunk }}
          path: ${{ runner.temp }}/stage

      # An empty or malformed declaration is a refusal, never "nothing to compare".
      - name: verify the downloaded tree against the build job's digest
        if: env.DECLARED_DIGEST != 'none'
        run: go run ./distdigest --verify "$DECLARED_DIGEST" "$RUNNER_TEMP/stage"

      - name: install zpkb
        if: env.DECLARED_DIGEST != 'none'
        run: |
          # The version the build job installs; a tag, never a moving branch.
          CGO_ENABLED=0 go install github.com/go-zpkg/zpkb/cmd/zpkb@v0.106.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # `--to` is spelled here and must equal the plan's: the plan is input from
      # the side that ran recipes, so it does not choose the destination.
      - name: sign and publish what the build staged
        if: env.DECLARED_DIGEST != 'none'
        env:
          PLATFORM: ${{ matrix.platform }}
          OCI_USERNAME: ${{ github.actor }}
          OCI_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          # The key follows the EFFECTIVE destination, as `inputcheck` decided
          # it: SIGN_PROD is `true` only for exactly oci://ghcr.io/go-zpkg/packages,
          # which gets ZPKG_SIGNING_KEY or nothing; every other destination
          # keeps the old key. Two guarded halves, not `a && X || Y`, which
          # would hand go-zpkg the old key when X is empty.
          SIGNING_KEY: ${{ (env.SIGN_PROD == 'true' && secrets.ZPKG_SIGNING_KEY) || (env.SIGN_PROD != 'true' && secrets.ARTIFACT_SIGNING_KEY) || '' }}
          ZPKG_EXTRA_TRUSTED_KEYS: ${{ env.EXTRA_KEYS }}
        run: |
          set -eu
          [ -n "$PUBLISH_TO" ] || { echo "::error::publishing requires an explicit destination; there is none"; exit 1; }
          unsigned=
          [ -n "$SIGNING_KEY" ] || unsigned=--allow-unsigned
          # shellcheck disable=SC2086  # one flag or nothing
          zpkb publish-stage "$RUNNER_TEMP/stage" --to "$PUBLISH_TO" --advisories "$PWD/advisories" $unsigned

      # The catalogue of a hosted destination: derived from the pantry (data,
      # no recipe runs), signed like any other artifact. One leg per platform.
      - name: clone pantry at the recorded commit
        if: env.DECLARED_DIGEST != 'none' && (matrix.chunk == '0' || matrix.chunk == 'manual') && env.PUBLISH_TO != ''
        env:
          PANTRY_REF: ${{ github.event.inputs.pantry_ref }}
        run: |
          set -eu
          ref=${PANTRY_REF:?pantry_ref is empty}
          case "$ref" in
            -*|*..*|*[!A-Za-z0-9._/-]*) echo "::error::pantry_ref '$ref' is not a branch, tag or SHA"; exit 1 ;;
          esac
          git init -q pantry
          git -C pantry fetch -q --depth 1 https://github.com/pkgxdev/pantry "$ref"
          git -C pantry checkout -q FETCH_HEAD
      - name: clone the pantry overlay
        if: env.DECLARED_DIGEST != 'none' && (matrix.chunk == '0' || matrix.chunk == 'manual') && env.PUBLISH_TO != ''
        env:
          IN_OVERLAY_REF: ${{ github.event.inputs.overlay_ref }}
        run: |
          set -eu
          ref="${IN_OVERLAY_REF:-main}"
          case "$ref" in
            -*|*..*|*[!A-Za-z0-9._/-]*) echo "::error::refusing overlay_ref" >&2; exit 1 ;;
          esac
          git init -q overlay
          git -C overlay fetch -q --depth 1 https://github.com/go-zpkg/recipes "$ref"
          git -C overlay checkout -q FETCH_HEAD
      - name: publish the catalogue
        if: env.DECLARED_DIGEST != 'none' && (matrix.chunk == '0' || matrix.chunk == 'manual') && env.PUBLISH_TO != ''
        env:
          PLATFORM: ${{ matrix.platform }}
          OCI_USERNAME: ${{ github.actor }}
          OCI_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ (env.SIGN_PROD == 'true' && secrets.ZPKG_SIGNING_KEY) || (env.SIGN_PROD != 'true' && secrets.ARTIFACT_SIGNING_KEY) || '' }}
          # zpkb catalog --publish pushes to $ZPKG_DIST: catalogue where it published.
          ZPKG_DIST: ${{ env.PUBLISH_TO }}
          ZPKG_EXTRA_TRUSTED_KEYS: ${{ env.EXTRA_KEYS }}
        run: |
          set -eu
          zpkb catalog \
            --recipe-dir pantry \
            --overlay overlay \
            --overrides overrides \
            --versions \
            --platform "$PLATFORM" \
            --publish
